<!doctype html>
<!--
  KALLAWAY × Healthy Days · 自家卡 · STAT ODOMETER — 比例數字場景（全屏 9:16，淺色）
  來源（2026-10-16 重做）：動作跟 text-motion-40 #29 Odometer（數字逐位滾動、後一位慢 0.12 秒、power3.out、停定、由下彈入）；
  外觀跟骨質疏鬆篇（2026-10-15 用戶批）mg_quarter：白藍漸變色塊＋內高光＋陰影＋中線接縫、品牌藍大數字、人形、被標示嗰個亮＋光暈、藍色膠囊。
  即係「動作取自原作、外觀跟品牌」，唔係原作 code 搬過嚟。顏色全部讀品牌 tokens（--accent／--head），換品牌自動跟。
  用途：「X% 嘅人／X 成」呢類比例數字，用畫面講比例，唔係得個數字。
  Slots: num（1–3 位數字，例 25）, unit（預設 %）, n（人形數 0–5，預設 4；0＝淨數字）, hl（由右數亮起幾個，預設 1）,
         pill（下方膠囊，≤ 10 字，可留空）, title（頂部標題，可留空，≤ 8 字）
  data-cues：第 1 個＝數字開始滾，第 2 個＝人形出現，第 3 個＝膠囊出現（相對卡開始秒數）。
  全屏卡：講者被蓋住；字幕照出（全屏期間字幕照出，用戶 2026-10-15）；效果字 ≥ 76px（膠囊 76px、數字 170px）。
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #x-stat-odometer { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font-display, "Noto Sans TC", sans-serif); color: var(--head, #0B2A3A);
        --ac: var(--accent, #1A80D0); --ac-hi: color-mix(in srgb, var(--ac) 80%, #fff); --ac-lo: color-mix(in srgb, var(--ac) 78%, #000); --navy: var(--head, #0B2A3A); }
      #x-stat-odometer .bg { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 38%, #FFFFFF 0%, #EAF3FB 55%, #D3E5F4 100%); }
      #x-stat-odometer .title { position: absolute; left: 0; right: 0; top: 385px; text-align: center; font: 900 96px/1.1 var(--font-display, "Noto Sans TC", sans-serif); color: var(--navy); opacity: 0; white-space: nowrap; z-index: 20; }
      #x-stat-odometer .title:empty { display: none; }
      #x-stat-odometer .odo { position: absolute; left: 0; right: 0; top: 470px; display: flex; justify-content: center; gap: 16px; align-items: center; opacity: 0; }
      #x-stat-odometer .tile { position: relative; width: 150px; height: 200px; border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #FFFFFF, #E7EFF7);
        box-shadow: inset 0 3px 0 #fff, 0 14px 28px rgba(11, 42, 58, 0.18); }
      #x-stat-odometer .tile::after { content: ""; position: absolute; left: 0; right: 0; top: 99px; height: 3px; background: rgba(11, 42, 58, 0.12); }
      #x-stat-odometer .col { position: absolute; left: 0; top: 0; width: 150px; }
      #x-stat-odometer .col b { display: block; height: 200px; font: 900 170px/200px var(--font-display, "Noto Sans TC", sans-serif); text-align: center; color: var(--ac); }
      #x-stat-odometer .unit { font: 900 150px/1 var(--font-display, "Noto Sans TC", sans-serif); color: var(--ac); margin-left: 6px; }
      #x-stat-odometer .ppl { position: absolute; left: 0; right: 0; top: 760px; display: flex; justify-content: center; gap: 50px; }
      #x-stat-odometer .pp { position: relative; width: 170px; height: 330px; opacity: 0; }
      #x-stat-odometer .pp .h { position: absolute; left: 48px; top: 0; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #FBE2CB, #F0C9A6 60%, #E2B48E); }
      #x-stat-odometer .pp .hair { position: absolute; left: 44px; top: -10px; width: 82px; height: 44px; border-radius: 40px 40px 14px 14px; background: linear-gradient(180deg, #F2F4F6, #C7CED6); }
      #x-stat-odometer .pp .bun { position: absolute; left: 66px; top: -34px; width: 38px; height: 34px; border-radius: 50%; background: linear-gradient(180deg, #F6F7F9, #C9D0D8); }
      #x-stat-odometer .pp .bd { position: absolute; left: 20px; top: 86px; width: 130px; height: 236px; border-radius: 70px 70px 26px 26px; clip-path: polygon(26% 0, 74% 0, 100% 100%, 0 100%); background: linear-gradient(90deg, #9FB7C9, #C5D5E2 45%, #9FB7C9); }
      #x-stat-odometer .pp.hl .bd { background: linear-gradient(90deg, var(--ac-lo), var(--ac-hi) 45%, var(--ac-lo)); }
      #x-stat-odometer .pp .glow { position: absolute; left: -20px; top: -40px; width: 210px; height: 400px; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--accent-rgb, 26, 128, 208), 0.28), rgba(var(--accent-rgb, 26, 128, 208), 0)); opacity: 0; }
      #x-stat-odometer .pills { position: absolute; left: 52px; right: 52px; top: 1265px; display: flex; justify-content: center; gap: 22px; z-index: 20; }
      #x-stat-odometer .pill { padding: 12px 36px 18px; border-radius: 999px; background: linear-gradient(180deg, var(--ac-hi), var(--ac)); color: #fff; font: 900 76px/1 var(--font-display, "Noto Sans TC", sans-serif);
        border: 4px solid rgba(255, 255, 255, 0.92); box-shadow: 0 12px 28px rgba(11, 42, 58, 0.22); opacity: 0; white-space: nowrap; }
      #x-stat-odometer .pill:empty { display: none; }
      #x-stat-odometer .sl { display: none; }
    </style>
  </head>
  <body>
    <div id="x-stat-odometer" data-composition-id="x-stat-odometer" data-start="0" data-width="1080" data-height="1920">
      <div class="bg"></div>
      <i class="sl" data-slot="num">25</i><i class="sl" data-slot="unit">%</i><i class="sl" data-slot="n">4</i><i class="sl" data-slot="hl">1</i>
      <div class="title" data-slot="title"></div>
      <div class="odo"></div>
      <div class="ppl"></div>
      <div class="pills"><div class="pill" data-slot="pill">65歲或以上女性</div></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const ROOT = document.querySelector('[data-composition-id="x-stat-odometer"]');
        const DUR = +ROOT.dataset.dur || 4.6;
        const CUES = (ROOT.dataset.cues || '').split(',').filter(Boolean).map(Number);
        const c = function (i, d) { return CUES.length > i ? CUES[i] : d; };
        const q = function (s) { return ROOT.querySelector(s); }, qa = function (s) { return ROOT.querySelectorAll(s); };
        const slot = function (n, d) { const e = q('[data-slot="' + n + '"]'); const v = e ? e.textContent.trim() : ''; return v === '' ? d : v; };
        const digits = slot('num', '25').replace(/[^0-9]/g, '').slice(0, 3) || '0';
        const N = Math.max(0, Math.min(5, parseInt(slot('n', '4'), 10) || 0)), HL = Math.max(1, Math.min(N || 1, parseInt(slot('hl', '1'), 10) || 1));
        /* 版面 */
        const odo = q('.odo'); let h = '';
        digits.split('').forEach(function () { let rows = ''; for (let k = 0; k < 20; k++) rows += '<b>' + (k % 10) + '</b>'; h += '<div class="tile"><div class="col">' + rows + '</div></div>'; });
        odo.innerHTML = h + '<span class="unit"></span>'; odo.querySelector('.unit').textContent = slot('unit', '%');
        const ppl = q('.ppl'); let p = '';
        for (let i = 0; i < N; i++) p += '<div class="pp' + (i >= N - HL ? ' hl' : '') + '"><i class="glow"></i><i class="bd"></i><i class="h"></i><i class="hair"></i><i class="bun"></i></div>';
        ppl.innerHTML = p; if (!N) odo.style.top = '760px';
        /* 動作：#29 Odometer（逐位滾動；原作 duration 1.1＋位序×0.12、power3.out；色塊由下彈入） */
        const tl = gsap.timeline({ paused: true });
        const t0 = c(0, 0.3);
        tl.fromTo(q('.bg'), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
        tl.fromTo(odo, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: 'back.out(1.6)' }, Math.max(0.05, t0 - 0.2));
        qa('.col').forEach(function (col, i) { tl.fromTo(col, { y: 0 }, { y: -200 * (10 + Number(digits[i])), duration: 1.1 + i * 0.12, ease: 'power3.out' }, t0); });
        /* 人形：逐個彈出，最後被標示嗰個亮＋光暈＋脈衝（骨質疏鬆篇 mg_quarter） */
        const t1 = c(1, 0.8);
        qa('.pp').forEach(function (el, i) { tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: 'back.out(1.7)' }, t1 + i * 0.12); });
        const th = t1 + N * 0.12 + 0.3;
        qa('.pp.hl').forEach(function (el) {
          tl.to(el.querySelector('.glow'), { opacity: 1, duration: 0.3 }, th);
          tl.fromTo(el, { scale: 1 }, { scale: 1.1, transformOrigin: '50% 100%', duration: 0.22, yoyo: true, repeat: 3 }, th);
        });
        /* 標題、膠囊 */
        if (q('.title').textContent.trim()) tl.fromTo(q('.title'), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' }, Math.max(0.05, t0 - 0.2));
        tl.fromTo(q('.pill'), { opacity: 0, y: 30, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, c(2, 2.0));
        tl.to(ROOT.children, { opacity: 0, duration: 0.25, ease: 'power2.in' }, DUR - 0.27).set({}, {}, 7);
        window.__timelines["x-stat-odometer"] = tl;
      })();
    </script>
  </body>
</html>
