<!doctype html>
<!--
  KALLAWAY · tier1 · overview · CHECKLIST — 9:16 直向中文版
  由 cards/tier1/t1-overview-checklist.html 改：直向單欄、字放大、2–4 行（空嘅行自動隱藏）、
  逐行出現時間讀 data-cues（第一個數＝標題，之後每行一個，秒數由卡開始計）。
  Slots: title（≤ 8 字，可用 <em> 標一個重點詞）, i1–i4（每行 ≤ 7 字）, p1–p4（可選：每行圓形縮圖路徑，有圖就取代剔號）。
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-check {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-body); overflow: hidden;
      }
      #t1-ov-check .bloom { position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1; }
      #t1-ov-check .grid {
        position: absolute; inset: 0; z-index: 1;
        background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45;
        -webkit-mask-image: radial-gradient(130% 90% at 50% 60%, #000 30%, transparent 78%);
                mask-image: radial-gradient(130% 90% at 50% 60%, #000 30%, transparent 78%);
      }
      #t1-ov-check .layout {
        position: absolute; left: 0; right: 0; top: 400px; bottom: 364px; z-index: 3;
        display: flex; flex-direction: column; justify-content: center; padding: 0 var(--pad);
      }
      #t1-ov-check .card-title {
        font-family: var(--font-display); font-weight: 900;
        font-size: var(--size-headline); color: var(--head); text-shadow: var(--textglow);
        margin-bottom: 72px; line-height: 1.15; text-align: center;
      }
      #t1-ov-check .card-title em { font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent); }
      #t1-ov-check .rows { display: flex; flex-direction: column; gap: 36px; }
      #t1-ov-check .row {
        display: flex; align-items: center; gap: 44px;
        background: var(--glass-bg-dark); border: var(--stroke) solid var(--glass-border);
        border-radius: var(--radius); padding: 44px 56px;
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
      }
      #t1-ov-check .check-wrap {
        width: 104px; height: 104px; flex-shrink: 0; border-radius: 50%;
        border: 3px solid rgba(var(--accent-rgb), 0.55); background: rgba(var(--accent-rgb), 0.10);
        box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.25), inset 0 0 12px rgba(var(--accent-rgb), 0.15);
        display: flex; align-items: center; justify-content: center;
      }
      #t1-ov-check .check-wrap svg { width: 54px; height: 54px; overflow: visible; }
      #t1-ov-check .check-wrap svg path {
        fill: none; stroke: var(--accent); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 48; stroke-dashoffset: 48; filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.80));
      }
      #t1-ov-check .thumb { width: 190px; height: 190px; flex-shrink: 0; border-radius: 50%; object-fit: cover; border: 8px solid #fff; box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.45), 0 10px 26px rgba(11, 42, 58, 0.16); display: none; }
      #t1-ov-check .row.has-thumb .thumb { display: block; }
      #t1-ov-check .row.has-thumb .check-wrap { display: none; }
      #t1-ov-check .row.has-thumb { padding: 26px 48px; gap: 40px; }
      #t1-ov-check .row-text {
        font-family: var(--font-display); font-weight: 900; font-size: 76px;
        color: var(--head); line-height: 1.15;
      }
      #t1-ov-check .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 6; background: var(--vignette); }
      #t1-ov-check .grain {
        position: absolute; inset: -40px; background: var(--tex-grain); background-size: 200px 200px;
        mix-blend-mode: overlay; opacity: 0.10; pointer-events: none; z-index: 7;
      }
    </style>
  </head>
  <body>
    <div id="t1-ov-check" data-composition-id="t1-ov-check" data-start="0" data-width="1080" data-height="1920">
      <div class="bloom"></div>
      <div class="grid"></div>
      <div class="layout">
        <div class="card-title" data-slot="title">開工前<em>檢查</em>清單</div>
        <div class="rows">
          <div class="row" id="chk-row-1"><img class="thumb" data-slot="p1" src="" alt="" /><div class="check-wrap"><svg viewBox="0 0 36 36"><path id="chk-path-1" d="M6 18 L15 27 L30 10" /></svg></div><div class="row-text" data-slot="i1">第一項</div></div>
          <div class="row" id="chk-row-2"><img class="thumb" data-slot="p2" src="" alt="" /><div class="check-wrap"><svg viewBox="0 0 36 36"><path id="chk-path-2" d="M6 18 L15 27 L30 10" /></svg></div><div class="row-text" data-slot="i2">第二項</div></div>
          <div class="row" id="chk-row-3"><img class="thumb" data-slot="p3" src="" alt="" /><div class="check-wrap"><svg viewBox="0 0 36 36"><path id="chk-path-3" d="M6 18 L15 27 L30 10" /></svg></div><div class="row-text" data-slot="i3">第三項</div></div>
          <div class="row" id="chk-row-4"><img class="thumb" data-slot="p4" src="" alt="" /><div class="check-wrap"><svg viewBox="0 0 36 36"><path id="chk-path-4" d="M6 18 L15 27 L30 10" /></svg></div><div class="row-text" data-slot="i4"></div></div>
        </div>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ROOT = document.querySelector('[data-composition-id="t1-ov-check"]');
      const CUES = (ROOT.dataset.cues || '').split(',').filter(Boolean).map(Number);
      const tTitle = CUES.length ? CUES[0] : 0.5;
      const A = getComputedStyle(ROOT).getPropertyValue('--accent-rgb').trim() || '55,189,248';
      const rows = [1, 2, 3, 4].filter(n => document.querySelector('#chk-row-' + n + ' .row-text').textContent.trim());
      [1, 2, 3, 4].forEach(n => { const r = document.getElementById('chk-row-' + n); const im = r.querySelector('.thumb'); if (im && im.getAttribute('src')) r.classList.add('has-thumb'); });
      [1, 2, 3, 4].forEach(n => { if (!rows.includes(n)) document.getElementById('chk-row-' + n).style.display = 'none'; });

      tl.fromTo("#t1-ov-check .grain", { backgroundPosition: "0px 0px" },
        { backgroundPosition: "110px 70px", duration: 0.6, ease: "none", repeat: 11, yoyo: true }, 0);
      tl.from("#t1-ov-check .bloom", { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0)
        .from("#t1-ov-check .grid", { autoAlpha: 0, duration: 1.1, ease: "power2.out" }, 0.2)
        .from("#t1-ov-check .card-title", { autoAlpha: 0, y: 28, filter: "blur(12px)", duration: 0.85, ease: "power4.out" }, tTitle);

      rows.forEach((n, i) => {
        const t = CUES.length > i + 1 ? CUES[i + 1] : tTitle + 0.4 + i * 0.18;
        tl.from('#chk-row-' + (n), { autoAlpha: 0, y: 38, x: -16, filter: "blur(8px)", duration: 0.7, ease: "back.out(1.3)" }, t)
          .to('#chk-row-' + (n) + ' .check-wrap', { boxShadow: '0 0 30px rgba(' + (A) + ',0.55), inset 0 0 18px rgba(' + (A) + ',0.25)', duration: 0.35, ease: "power2.out" }, t + 0.2)
          .to('#chk-path-' + (n), { strokeDashoffset: 0, duration: 0.38, ease: "power3.out" }, t + 0.28);
      });
      tl.to("#t1-ov-check .bloom", { opacity: 0.75, duration: 1.3, ease: "sine.inOut", repeat: 2, yoyo: true }, 3.0)
        ;
      const DUR = +ROOT.dataset.dur || 7;
      tl.to("#t1-ov-check .layout", { autoAlpha: 0, scale: 0.97, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, DUR - 0.5)
        .set({}, {}, 7);
      window.__timelines["t1-ov-check"] = tl;
    </script>
  </body>
</html>
