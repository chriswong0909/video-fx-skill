<!doctype html>
<!--
  KALLAWAY · tier1 · overview · FLOW — 9:16 直向中文版（流程）
  由 cards/tier1/t1-overview-flow.html 改：原卡橫排 4 個玻璃節點 + 虛線 + 發光箭咀；直向改做由上至下一疊，
  每個節點：Space Mono 編號（01…）+ 發光點 + 標籤 80px，節點之間虛線同發光箭咀畫出嚟。逐個節點跟 data-cues 出（講到先出）。
  可選 img：全屏圖片做底（慢推），成組貼底（圖片主體留喺上半），標題改白色發光字；冇 img 就係原本淺色 canvas + 光暈，垂直置中。
  資訊卡時段唔出字幕。
  Slots: title（≤ 8 字，可用 <em>）, n1–n4（每個 ≤ 7 字；空嘅自動隱藏）, img, pos（圖片焦點，預設 50% 30%）。
  data-cues：第一個＝標題，之後每個節點一個。
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      html, body { margin: 0; }
      #t1-ov-flow { position: absolute; inset: 0; width: 1080px; height: 1920px; background: var(--canvas); color: var(--text); font-family: var(--font-display); overflow: hidden; }
      #t1-ov-flow .bloom { position: absolute; inset: 0; background: var(--bloom-bottom); z-index: 1; }
      #t1-ov-flow .grid { position: absolute; inset: 0; z-index: 1; background-image: var(--dot); background-size: var(--dot-size); opacity: 0.45; }
      #t1-ov-flow .pic { position: absolute; inset: 0; overflow: hidden; z-index: 2; display: none; }
      #t1-ov-flow .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 30%; }
      #t1-ov-flow .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 1300px; z-index: 3; display: none;
        background: linear-gradient(to top, rgba(6, 10, 34, 0.86) 0%, rgba(6, 10, 34, 0.62) 55%, rgba(6, 10, 34, 0) 100%); }
      #t1-ov-flow.has-img .pic, #t1-ov-flow.has-img .scrim { display: block; }
      #t1-ov-flow .layout { position: absolute; left: 0; right: 0; top: 400px; bottom: 364px; z-index: 4; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--pad); }
      #t1-ov-flow.has-img .layout { justify-content: flex-end; }
      #t1-ov-flow .title { font: 900 var(--size-headline)/1.15 var(--font-display); color: var(--head); text-shadow: var(--textglow); text-align: center; margin-bottom: 44px; white-space: nowrap; }
      #t1-ov-flow .title em { font-style: normal; color: var(--accent); text-shadow: var(--textglow-accent); }
      #t1-ov-flow.has-img .title { color: #fff; text-shadow: 0 0 26px rgba(var(--accent-rgb), 0.95), 0 0 60px rgba(var(--accent-rgb), 0.6), 0 2px 10px rgba(0,0,0,0.5); }
      #t1-ov-flow.has-img .title em { color: #fff; }
      #t1-ov-flow .node-glass { background: var(--glass-bg-dark); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--stroke) solid var(--glass-border); border-radius: var(--radius); padding: 22px 48px 24px 40px; display: flex; align-items: center; gap: 30px; position: relative; overflow: hidden;
        box-shadow: var(--glass-shadow), 0 0 44px rgba(var(--accent-rgb), 0.12), inset 0 1px 0 var(--glass-hi); }
      #t1-ov-flow .node-glass::after { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 5px; border-radius: 0 3px 3px 0;
        background: linear-gradient(180deg, transparent, rgba(var(--accent-rgb), 0.9), transparent); }
      #t1-ov-flow .node-index { font: 700 56px/1 var(--font-mono); color: var(--accent); letter-spacing: 0.04em; text-shadow: var(--textglow-accent); flex-shrink: 0; }
      #t1-ov-flow .node-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.85), 0 0 34px rgba(var(--accent-rgb), 0.45); }
      #t1-ov-flow .node-label { font: 900 80px/1.15 var(--font-display); color: var(--head); white-space: nowrap; }
      #t1-ov-flow .flow-connector { height: 44px; position: relative; }
      #t1-ov-flow .flow-connector u { position: absolute; left: 76px; top: 2px; height: 26px; width: 0; border-left: 4px dashed rgba(var(--accent-rgb), 0.75); display: block; }
      #t1-ov-flow.has-img .flow-connector u { border-left-color: rgba(255, 255, 255, 0.8); }
      #t1-ov-flow .flow-connector svg { position: absolute; left: 58px; top: 20px; width: 40px; height: 24px; overflow: visible; }
      #t1-ov-flow .flow-connector polyline { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.9)); }
      #t1-ov-flow.has-img .flow-connector polyline { stroke: #fff; }
      #t1-ov-flow .pos { display: none; }
    </style>
  </head>
  <body>
    <div id="t1-ov-flow" data-composition-id="t1-ov-flow" data-start="0" data-width="1080" data-height="1920">
      <div class="bloom"></div><div class="grid"></div>
      <div class="pic"><img data-slot="img" src="" alt="" /></div><div class="scrim"></div>
      <i class="pos" data-slot="pos">50% 30%</i>
      <div class="layout">
        <div class="title" data-slot="title">流程<em>點行</em></div>
        <div class="flow-node" id="fn1"><div class="node-glass"><div class="node-index">01</div><div class="node-dot"></div><div class="node-label" data-slot="n1">第1步</div></div></div>
        <div class="flow-step" id="fs2"><div class="flow-connector" id="fc2"><u></u><svg viewBox="0 0 40 24"><polyline points="8,6 20,18 32,6" /></svg></div><div class="flow-node" id="fn2"><div class="node-glass"><div class="node-index">02</div><div class="node-dot"></div><div class="node-label" data-slot="n2">第2步</div></div></div></div>
        <div class="flow-step" id="fs3"><div class="flow-connector" id="fc3"><u></u><svg viewBox="0 0 40 24"><polyline points="8,6 20,18 32,6" /></svg></div><div class="flow-node" id="fn3"><div class="node-glass"><div class="node-index">03</div><div class="node-dot"></div><div class="node-label" data-slot="n3"></div></div></div></div>
        <div class="flow-step" id="fs4"><div class="flow-connector" id="fc4"><u></u><svg viewBox="0 0 40 24"><polyline points="8,6 20,18 32,6" /></svg></div><div class="flow-node" id="fn4"><div class="node-glass"><div class="node-index">04</div><div class="node-dot"></div><div class="node-label" data-slot="n4"></div></div></div></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ROOT = document.querySelector('[data-composition-id="t1-ov-flow"]');
      const CUES = (ROOT.dataset.cues || '').split(',').filter(Boolean).map(Number);
      const DUR = +ROOT.dataset.dur || 7;
      const IMG = ROOT.querySelector('.pic img'); const hasImg = !!IMG.getAttribute('src');
      if (hasImg) { ROOT.querySelector('.layout').parentNode.classList.add('has-img'); IMG.style.objectPosition = (ROOT.querySelector('.pos').textContent.trim() || '50% 30%');
        tl.fromTo(IMG, { scale: 1 }, { scale: 1.07, duration: DUR, ease: "none" }, 0).from(ROOT.querySelector('.scrim'), { opacity: 0, duration: 0.5, ease: "power2.out" }, 0); }
      else tl.from(ROOT.querySelector('.bloom'), { autoAlpha: 0, scale: 0.88, transformOrigin: "50% 120%", duration: 1.4, ease: "expo.out" }, 0);
      const tT = CUES.length ? CUES[0] : 0.4;
      tl.from(ROOT.querySelector('.title'), { opacity: 0, y: 28, filter: "blur(14px)", duration: 0.7, ease: "power4.out" }, tT);
      let shown = 0;
      [1, 2, 3, 4].forEach(function (n) {
        const nd = ROOT.querySelector('#fn' + n); const st = n > 1 ? ROOT.querySelector('#fs' + n) : null;
        if (!nd.querySelector('.node-label').textContent.trim()) { (st || nd).style.display = 'none'; return; }
        const t = CUES.length > shown + 1 ? CUES[shown + 1] : tT + 0.6 + shown * 1.0; shown++;
        if (st) { tl.from(st.querySelector('u'), { scaleY: 0, opacity: 0, transformOrigin: "50% 0%", duration: 0.3, ease: "power2.out" }, Math.max(0, t - 0.35))
                    .from(st.querySelector('svg'), { opacity: 0, y: -10, duration: 0.25, ease: "power2.out" }, Math.max(0, t - 0.12)); }
        tl.from(nd, { opacity: 0, y: 30, scale: 0.94, filter: "blur(10px)", transformOrigin: "50% 50%", duration: 0.6, ease: "back.out(1.4)" }, t)
          .fromTo(nd.querySelector('.node-dot'), { scale: 1 }, { scale: 1.5, duration: 0.3, ease: "sine.inOut", repeat: 1, yoyo: true }, t + 0.3);
      });
      tl.set({}, {}, 7);
      window.__timelines["t1-ov-flow"] = tl;
    </script>
  </body>
</html>
