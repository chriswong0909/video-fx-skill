<!doctype html>
<!--
  KALLAWAY × Healthy Days · 自家卡 · IMAGE SPLIT — 上圖下人（9:16）
  畫面上半（0–860）係圖片，下半係講者（主檔要同時將講者鏡頭向下移：#camInner scale 1.1、y 430；咁樣頭頂喺 940、下巴 1160，字幕 1390 唔會遮口）。
  借舊效果庫 FX-071（解說畫板 + 講者）嘅分屏做法，用 Kallaway 白玻璃邊同品牌藍膠囊。句與句之間硬切。
  Slots: img, pos（圖片焦點，預設 50% 62%）, title（可選，左上標題條，只放段落標題／分題，84px）, tags（可選，壓住圖片底邊嘅膠囊，用「、」分，≤ 3 個，每個 ≤ 4 字）。
  data-cues：第一個＝標題條，之後每個膠囊一個。
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #x-img-split { position: absolute; inset: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; font-family: var(--font-display); }
      #x-img-split .panel { position: absolute; left: 0; right: 0; top: 0; height: 860px; overflow: hidden; background: var(--canvas);
        border-bottom: 10px solid #fff; box-shadow: 0 14px 40px rgba(11, 42, 58, 0.28); }
      #x-img-split .panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 60%; }
      #x-img-split .panel::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
      #x-img-split .pos { display: none; }
      #x-img-split .ttag { position: absolute; left: 0; top: 228px; height: 128px; display: flex; align-items: center; gap: 24px;
        padding: 0 52px 0 40px; background: var(--tag, #2f68a8); border-radius: 0 999px 999px 0; box-shadow: 0 10px 28px rgba(11, 42, 58, 0.22); max-width: 700px; }
      #x-img-split .ttag svg { width: 60px; height: 60px; flex: 0 0 auto; }
      #x-img-split .tx { font: 900 84px/1 var(--font-display); color: #fff; white-space: nowrap; }
      #x-img-split .tag-row { position: absolute; left: 52px; right: 52px; top: 790px; display: flex; justify-content: center; gap: 14px; flex-wrap: nowrap; }
      #x-img-split .tag { display: inline-flex; align-items: center; gap: 12px; padding: 14px 30px 18px; border-radius: 999px; white-space: nowrap;
        background: rgba(var(--accent-rgb), 0.94); border: 2px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 22px rgba(11, 42, 58, 0.22); }
      #x-img-split .tag-dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; flex-shrink: 0; }
      #x-img-split .tag-text { font: 900 76px/1 var(--font-display); color: #fff; }
    </style>
  </head>
  <body>
    <div id="x-img-split" data-composition-id="x-img-split" data-start="0" data-width="1080" data-height="1920">
      <div class="panel"><img data-slot="img" src="assets/img/k09_control.jpg" alt="" /></div>
      <i class="pos" data-slot="pos">50% 62%</i>
      <div class="ttag"><svg viewBox="0 0 54 54"><path d="M19 4h16v15h15v16H35v15H19V35H4V19h15z" fill="#ffffff" /></svg><div class="tx" data-slot="title"></div></div>
      <div class="tag-row" data-slot="tags">體重、血壓、血糖</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ROOT = document.querySelector('[data-composition-id="x-img-split"]');
      const CUES = (ROOT.dataset.cues || '').split(',').filter(Boolean).map(Number);
      const DUR = +ROOT.dataset.dur || 5;
      const IMG = ROOT.querySelector('.panel img');
      IMG.style.objectPosition = (ROOT.querySelector('.pos').textContent.trim() || '50% 62%');
      const TAG = ROOT.querySelector('.ttag'); const hasTitle = !!ROOT.querySelector('.tx').textContent.trim();
      if (!hasTitle) TAG.style.display = 'none';
      const row = ROOT.querySelector('.tag-row');
      const tags = row.textContent.split(/[、,，]/).map(s => s.trim()).filter(Boolean);
      row.textContent = '';
      tags.forEach((s, i) => { const d = document.createElement('div'); d.className = 'tag'; d.id = 'x-img-split-t' + i;
        const dot = document.createElement('div'); dot.className = 'tag-dot'; const tx = document.createElement('div'); tx.className = 'tag-text'; tx.textContent = s;
        d.appendChild(dot); d.appendChild(tx); row.appendChild(d); });
      tl.fromTo(IMG, { scale: 1.0 }, { scale: 1.06, duration: DUR, ease: "none" }, 0);
      const tT = CUES.length ? CUES[0] : 0.3;
      if (hasTitle) tl.fromTo(TAG, { xPercent: -110 }, { xPercent: 0, duration: 0.4, ease: "power3.out" }, Math.max(0, tT - 0.15));
      tags.forEach((s, i) => { const t = CUES.length > i + 1 ? CUES[i + 1] : tT + 0.6 + i * 0.35;
        tl.from('#x-img-split-t' + i, { autoAlpha: 0, y: 26, scale: 0.7, transformOrigin: "50% 100%", duration: 0.5, ease: "back.out(1.7)" }, t); });
      tl.set({}, {}, 7);
      window.__timelines["x-img-split"] = tl;
    </script>
  </body>
</html>
