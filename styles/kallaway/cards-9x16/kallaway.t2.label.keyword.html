<!doctype html>
<!--
  KALLAWAY · tier2 · label · KEYWORD — 9:16 直向中文版
  由 cards/tier2/t2-lb-keyword.html 改：2026-10-02 用戶話放頭頂太貼面 → 搬去胸口位（top 1120，字幕位之上／取代字幕），大字 120px、註 76px（唔細過字幕）；用呢張卡嗰句字幕唔出（skipcaps）。舊位置 y 380 已停用；
  講者頭頂好近（推近鏡）就唔好用 note，或者改用 lower-third 類卡。
  漸變發光大字（白→品牌藍）+ 深色玻璃底 + 細註。透明背景，疊喺講者上面。
  Slots: term（≤ 6 字）, note（≤ 14 字，可留空）, top（可選，卡頂 px，預設 1120；疊喺全屏圖片上面可以放圖片留白位）。
  data-cues：第一個數＝大字出現秒數；第二個數（可選）＝ note 出現秒數。
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #t2-lb-key {
        position: absolute; inset: 0; width: 1080px; height: 1920px;
        background: transparent; overflow: hidden; font-family: var(--font-display);
      }
      #t2-lb-key .local-glow {
        position: absolute; left: 140px; top: 1080px; width: 800px; height: 320px; border-radius: 50%;
        background: radial-gradient(ellipse at 50% 50%, rgba(var(--accent-rgb), 0.30) 0%, rgba(var(--accent-rgb), 0.08) 50%, transparent 75%);
        filter: blur(44px); pointer-events: none;
      }
      #t2-lb-key .wrap { position: absolute; left: 60px; right: 60px; top: 1120px; display: flex; justify-content: center; }
      #t2-lb-key .underlay {
        background: var(--glass-bg-dark);
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        border: 1.5px solid var(--glass-border); border-top: 1.5px solid var(--glass-hi);
        box-shadow: var(--glass-shadow); border-radius: var(--radius);
        padding: 16px 52px 18px; position: relative; overflow: hidden; text-align: center;
      }
      #t2-lb-key .underlay::before {
        content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
        background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.10), var(--accent) 50%, rgba(var(--accent-rgb), 0.10));
        box-shadow: 0 2px 14px rgba(var(--accent-rgb), 0.55);
      }
      #t2-lb-key .keyword {
        font-family: var(--font-display); font-weight: 900; font-size: 120px; line-height: 1.08;
        background: linear-gradient(100deg, var(--grad-start) 0%, var(--grad-start) 45%, var(--accent) 80%, rgba(var(--accent-rgb), 0.8) 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
        filter: var(--kw-glow);
        display: block; white-space: nowrap;
      }
      #t2-lb-key .note {
        font-family: var(--font-body); font-weight: 900; font-size: 76px; color: var(--head); margin-top: 12px; white-space: nowrap;
      }
      #t2-lb-key .note:empty { display: none; }
      #t2-lb-key .pos { display: none; }
    </style>
  </head>
  <body>
    <div id="t2-lb-key" data-composition-id="t2-lb-key" data-start="0" data-width="1080" data-height="1920">
      <div class="local-glow"></div>
      <i class="pos" data-slot="top"></i>
      <div class="wrap"><div class="underlay">
        <span class="keyword" data-slot="term">盡早檢查</span>
        <div class="note" data-slot="note"></div>
      </div></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const COMP = "#t2-lb-key";
      const ROOT = document.querySelector('[data-composition-id="t2-lb-key"]');
      const CUES = (ROOT.dataset.cues || '').split(',').filter(Boolean).map(Number);
      const A = getComputedStyle(ROOT).getPropertyValue('--accent-rgb').trim() || '55,189,248';
      /* 長過 7 個字自動縮細，唔好爆出安全區（最細都大過字幕 76px） */
      const KW = ROOT.querySelector('.keyword'); const n = KW.textContent.trim().length; if (n > 7) KW.style.fontSize = Math.max(84, Math.floor(840 / n)) + 'px';
      const TOP = parseFloat(ROOT.querySelector('.pos').textContent);
      if (TOP) { ROOT.querySelector('.wrap').style.top = TOP + 'px'; ROOT.querySelector('.local-glow').style.top = (TOP - 40) + 'px'; }
      const t0 = CUES.length ? Math.max(0, CUES[0] - 0.32) : 0.2;   /* 大字喺講嗰刻清晰：玻璃底早少少入 */
      tl.from((COMP) + ' .local-glow', { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%", duration: 1.3, ease: "expo.out" }, Math.max(0, t0 - 0.2))
        .from((COMP) + ' .underlay', { autoAlpha: 0, y: -36, filter: "blur(14px)", duration: 0.82, ease: "back.out(1.4)" }, t0)
        .from((COMP) + ' .keyword', { autoAlpha: 0, y: 20, filter: "blur(18px) brightness(1.5)", duration: 0.78, ease: "power4.out" }, t0 + 0.32)
        .from((COMP) + ' .note', { autoAlpha: 0, y: 8, filter: "blur(6px)", duration: 0.50, ease: "power3.out" }, CUES.length > 1 ? CUES[1] : t0 + 0.7)
        .to((COMP) + ' .keyword', { filter: getComputedStyle(ROOT).getPropertyValue('--kw-glow-peak').trim() || 'drop-shadow(0 0 30px rgba(' + (A) + ',0.75))',
            duration: 1.2, ease: "sine.inOut", repeat: 2, yoyo: true }, t0 + 1.6)
        ;
      /* 出場：平滑縮細 + 模糊（Kallaway：唔好硬切）。DUR 由 cards.py use 寫入 data-dur */
      const DUR = +ROOT.dataset.dur || 7;
      tl.to((COMP) + ' .wrap, ' + (COMP) + ' .local-glow', { autoAlpha: 0, scale: 0.96, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, DUR - 0.45)
        .set({}, {}, 7);
      window.__timelines["t2-lb-key"] = tl;
    </script>
  </body>
</html>
