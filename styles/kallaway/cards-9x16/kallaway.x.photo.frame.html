<!doctype html>
<!--
  KALLAWAY · 自家卡 · PHOTO FRAME — 邊緣發光圖片框（9:16，純 Kallaway 文法）
  借 kallaway.t2.lower-third.portraitframe 嘅 edge-lit 圓角框（霓虹邊 + 多層光暈），入面放圖片；框入面張圖固定唔郁。
  講者保留，框放講者旁邊空位或者胸口位；唔帶字。短例子用（2–5 秒）。
  Slots: img, pos（圖片焦點，預設 50% 50%）, box（「left,top,闊,高」px，預設 290,900,500,460）。data-cues：第一個＝框出現。
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #x-photo-frame { position: absolute; inset: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
      #x-photo-frame .glow { position: absolute; border-radius: 50%; filter: blur(46px);
        background: radial-gradient(ellipse at 50% 50%, rgba(var(--accent-rgb), 0.34) 0%, rgba(var(--accent-rgb), 0.10) 52%, transparent 76%); }
      #x-photo-frame .frame { position: absolute; left: 290px; top: 900px; width: 500px; height: 460px; border-radius: 40px; overflow: hidden; background: #060a22;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.92), 0 0 0 8px rgba(var(--accent-rgb), 0.85), 0 0 26px rgba(var(--accent-rgb), 0.75), 0 0 70px rgba(var(--accent-rgb), 0.40), 0 24px 60px rgba(4, 8, 28, 0.45); }
      #x-photo-frame .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #x-photo-frame .frame::before { content: ""; position: absolute; top: 0; left: 12px; right: 12px; height: 2px; z-index: 2;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7) 35%, rgba(255,255,255,0.7) 65%, transparent); }
      #x-photo-frame .pos { display: none; }
    </style>
  </head>
  <body>
    <div id="x-photo-frame" data-composition-id="x-photo-frame" data-start="0" data-width="1080" data-height="1920">
      <div class="glow"></div>
      <div class="frame"><img data-slot="img" src="assets/img/x.jpg" alt="" /></div>
      <i class="pos p-pos" data-slot="pos">50% 50%</i><i class="pos p-box" data-slot="box"></i>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ROOT = document.querySelector('[data-composition-id="x-photo-frame"]');
      const CUES = (ROOT.dataset.cues || '').split(',').filter(Boolean).map(Number);
      const DUR = +ROOT.dataset.dur || 4;
      const FR = ROOT.querySelector('.frame'), GL = ROOT.querySelector('.glow');
      ROOT.querySelector('.frame img').style.objectPosition = (ROOT.querySelector('.p-pos').textContent.trim() || '50% 50%');
      let B = ROOT.querySelector('.p-box').textContent.split(',').map(Number).filter(function (n) { return !isNaN(n); });
      if (B.length !== 4) B = [290, 900, 500, 460];
      FR.style.left = B[0] + 'px'; FR.style.top = B[1] + 'px'; FR.style.width = B[2] + 'px'; FR.style.height = B[3] + 'px';
      GL.style.left = (B[0] - 90) + 'px'; GL.style.top = (B[1] - 50) + 'px'; GL.style.width = (B[2] + 180) + 'px'; GL.style.height = (B[3] + 140) + 'px';
      const t0 = CUES.length ? Math.max(0, CUES[0] - 0.3) : 0.1;
      tl.from(GL, { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%", duration: 1.1, ease: "expo.out" }, t0)
        .from(FR, { autoAlpha: 0, y: 40, scale: 0.88, filter: "blur(14px)", transformOrigin: "50% 100%", duration: 0.75, ease: "back.out(1.4)" }, t0)
        .to([FR, GL], { autoAlpha: 0, scale: 0.96, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, DUR - 0.45)
        .set({}, {}, 7);
      window.__timelines["x-photo-frame"] = tl;
    </script>
  </body>
</html>
