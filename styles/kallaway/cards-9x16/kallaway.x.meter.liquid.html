<!doctype html>
<!--
  KALLAWAY × Healthy Days · 自家卡 · METER LIQUID — 液體充滿量表（全屏 9:16，淺色）
  盲測（2026-10-16）：動作取自 text-motion-40 #37 Text Liquid Fill（輪廓字＋液面 clip-path 多邊形，11 點正弦波、振幅 6%、波相位 p×6π、60 步/秒，由下升上）。
  場景為本卡自行設計：大字（預設「鈣」）輪廓＋品牌藍液體升到指定水位，下面數字同步跳到 level%，底部膠囊一句說明。冇參考任何舊成品。顏色全讀品牌 tokens。
  Slots: glyph（1 個大字，預設 鈣）, level（0–100，預設 80）, unit（預設 %）, pill（底部說明，≤ 10 字，可留空）
  data-cues：1＝液體開始升（預設 0.5）；2＝膠囊出現（預設 升完＋0.2）。全屏卡，字幕照出；效果字 ≥ 76px。
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #x-meter-liquid { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font-display, "Noto Sans TC", sans-serif); color: var(--head, #0B2A3A);
        --ac: var(--accent, #1A80D0); --ac-hi: color-mix(in srgb, var(--ac) 80%, #fff); --navy: var(--head, #0B2A3A); }
      #x-meter-liquid .bg { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 38%, #FFFFFF 0%, #EAF3FB 55%, #D3E5F4 100%); }
      #x-meter-liquid .disc { position: absolute; left: 90px; top: 280px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFFFFF, #E4EEF7); box-shadow: inset 0 6px 0 #fff, 0 24px 56px rgba(11,42,58,.16); opacity: 0; }
      #x-meter-liquid .gl { position: absolute; left: 0; right: 0; top: 280px; height: 900px; display: grid; place-items: center; font: 900 620px/1 var(--font-display, "Noto Sans TC", sans-serif); opacity: 0; }
      #x-meter-liquid .gl > span { grid-area: 1/1; }
      #x-meter-liquid .o { color: #CBDBEA; }
      #x-meter-liquid .l { color: var(--ac); clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%); }
      #x-meter-liquid .num { position: absolute; left: 0; right: 0; top: 1210px; text-align: center; font: 900 200px/1 var(--font-display, "Noto Sans TC", sans-serif); color: var(--ac); opacity: 0; }
      #x-meter-liquid .pill { position: absolute; left: 50%; top: 1450px; transform: translateX(-50%); padding: 12px 40px 18px; border-radius: 999px; background: linear-gradient(180deg, var(--ac-hi), var(--ac)); color: #fff; font: 900 76px/1 var(--font-display, "Noto Sans TC", sans-serif); border: 4px solid rgba(255,255,255,.92); box-shadow: 0 12px 28px rgba(11,42,58,.22); opacity: 0; white-space: nowrap; }
      #x-meter-liquid .pill:empty { display: none; }
      #x-meter-liquid .sl { display: none; }
    </style>
  </head>
  <body>
    <div id="x-meter-liquid" data-composition-id="x-meter-liquid" data-start="0" data-width="1080" data-height="1920">
      <div class="bg"></div>
      <i class="sl" data-slot="glyph">鈣</i><i class="sl" data-slot="level">80</i><i class="sl" data-slot="unit">%</i>
      <div class="disc"></div>
      <div class="gl"><span class="o"></span><span class="l"></span></div>
      <div class="num"></div>
      <div class="pill" data-slot="pill">每日鈣質要達標</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        const ROOT = document.querySelector('[data-composition-id="x-meter-liquid"]');
        const DUR = +ROOT.dataset.dur || 4.6;
        const CUES = (ROOT.dataset.cues || '').split(',').filter(Boolean).map(Number);
        const c = function (i, d) { return CUES.length > i ? CUES[i] : d; };
        const q = function (s) { return ROOT.querySelector(s); };
        const slot = function (n, d) { const e = q('[data-slot="' + n + '"]'); const v = e ? e.textContent.trim() : ''; return v === '' ? d : v; };
        const glyph = Array.from(slot('glyph', '鈣'))[0], LV = Math.max(0, Math.min(100, parseFloat(slot('level', '80')) || 0)), unit = slot('unit', '%');
        q('.o').textContent = glyph; q('.l').textContent = glyph;
        const L = q('.l'), num = q('.num'), P = { lv: 0, ph: 0 };
        const draw = function () { /* #37：液面 = 11 點正弦波（振幅 4.5%，原作 6%）；lv 0..1 對應字框 92%→12% */
          const top = 92 - P.lv * 80; const pts = ['0% 100%'];
          for (let i = 0; i <= 10; i++) pts.push(i * 10 + '% ' + (top + Math.sin(i * 0.9 + P.ph * Math.PI * 6) * 4.5 * Math.min(1, P.lv * 8)).toFixed(1) + '%');
          pts.push('100% 100%'); L.style.clipPath = 'polygon(' + pts.join(',') + ')';
          num.textContent = Math.round(P.lv * 100) + unit; };
        const tl = gsap.timeline({ paused: true });
        const t0 = c(0, 0.5), rise = 1.6;
        tl.fromTo(q('.bg'), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
        tl.fromTo(q('.disc'), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.4)' }, 0.1);
        tl.fromTo(q('.gl'), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(1.5)' }, 0.2);
        tl.fromTo(num, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: 'back.out(1.6)' }, t0 - 0.1);
        tl.to(P, { lv: LV / 100, duration: rise, ease: 'power2.out', onUpdate: draw }, t0);
        tl.to(P, { ph: 1, duration: DUR, ease: 'none', onUpdate: draw }, 0);
        tl.fromTo(q('.pill'), { opacity: 0, y: 30, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, c(1, t0 + rise + 0.2));
        tl.to(ROOT.children, { opacity: 0, duration: 0.25, ease: 'power2.in' }, DUR - 0.27).set({}, {}, 7);
        draw();
        window.__timelines["x-meter-liquid"] = tl;
      })();
    </script>
  </body>
</html>
