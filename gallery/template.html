<title>video-fx 效果庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
 --bg:#eceef1;--surface:#ffffff;--surface2:#f5f6f8;--ink:#15181c;--muted:#5a626c;--line:#d4d8de;--accent:#d8452b;--well:#1b1e23;
 --c-caption:#7c4dff;--c-hook:#e08a00;--c-camera:#0a8fd6;--c-cutaway:#0e9f6e;--c-list-chart:#d63384;--c-layout:#5b5fe0;--c-transition:#0f9d8f;--c-grade-light:#b68a00;--c-accent:#7a8290;--c-sound:#c2410c;
 --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--surface:#1a1d21;--surface2:#22262b;--ink:#e8ebee;--muted:#9aa2ac;--line:#2e333a;--accent:#ff6a4d;--well:#0b0c0e;
 --c-caption:#a78bfa;--c-hook:#fbbf24;--c-camera:#38bdf8;--c-cutaway:#34d399;--c-list-chart:#f472b6;--c-layout:#8b8ff5;--c-transition:#2dd4bf;--c-grade-light:#facc15;--c-accent:#a1a8b3;--c-sound:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111316;--surface:#1a1d21;--surface2:#22262b;--ink:#e8ebee;--muted:#9aa2ac;--line:#2e333a;--accent:#ff6a4d;--well:#0b0c0e;
 --c-caption:#a78bfa;--c-hook:#fbbf24;--c-camera:#38bdf8;--c-cutaway:#34d399;--c-list-chart:#f472b6;--c-layout:#8b8ff5;--c-transition:#2dd4bf;--c-grade-light:#facc15;--c-accent:#a1a8b3;--c-sound:#fb923c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:clamp(16px,4vw,48px);padding-block:28px 64px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:.5px;margin:0;line-height:1.1;text-wrap:balance}
h1 small{display:block;font:500 13px/1.4 var(--mono);color:var(--muted);letter-spacing:.06em;margin-top:8px}
.tc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font:500 28px/1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.08em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chip .n{font-family:var(--mono);color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.7}
.dot{width:9px;height:9px;border-radius:2px;background:var(--cc,var(--muted));flex:none}
.chip:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{flex:1 1 220px;display:flex;gap:10px;justify-content:flex-end}
input[type=search],select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 11px;min-width:0}
input[type=search]{width:min(260px,100%)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;transition:transform .15s ease,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.pv{position:relative;aspect-ratio:3/4;background:var(--well);overflow:hidden}
.pv video,.pv img{width:100%;height:100%;object-fit:cover;display:block}
.pv.wide video,.pv.wide img{object-fit:contain}
.pv .tcode{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font:500 11.5px/1 var(--mono);padding:5px 7px;border-radius:4px;letter-spacing:.04em}
.pv .new{position:absolute;right:8px;top:8px;background:var(--accent);color:#fff;font:700 11px/1 var(--sans);padding:5px 7px;border-radius:4px;letter-spacing:.08em}
.cb{display:flex;flex-direction:column;gap:7px;padding:12px 14px 14px}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.cb h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.35}
.cb p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
dialog{border:none;padding:0;background:var(--surface);color:var(--ink);border-radius:14px;width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,15,.55)}
.dl{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:0}
.dl .media{background:var(--well);display:flex;align-items:flex-start;justify-content:center;padding:18px}
.dl .media video,.dl .media img{width:100%;max-height:70vh;object-fit:contain;border-radius:6px}
.dl .info{padding:22px 26px 26px;overflow:auto;max-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{margin:4px 0 0;font-size:24px;font-weight:900;line-height:1.25;text-wrap:balance}
.close{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;flex:none}
.lead{font-size:15px;margin:0}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13.5px;margin:0}
.meta dt{color:var(--muted)}.meta dd{margin:0}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.lk.bad{text-decoration:line-through;opacity:.75;cursor:default}
.body h4{margin:14px 0 4px;font-size:14px;letter-spacing:.04em}
.body p,.body li{font-size:14px;margin:4px 0}
.body ul{margin:4px 0;padding-left:20px}
code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:4px;word-break:break-all}
pre{background:var(--well);color:#dfe3e8;border-radius:8px;padding:12px;overflow:auto;font-size:12px;max-height:320px}
pre code{background:none;padding:0;color:inherit;word-break:normal}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.copy{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;margin:8px 0}
footer{color:var(--muted);font-size:12.5px}
@media (max-width:720px){.dl{grid-template-columns:1fr}.dl .media{max-height:48vh}.dl .media video,.dl .media img{max-height:44vh}.dl .info{max-height:none}.stats{gap:18px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.pv .ban{position:absolute;right:8px;bottom:8px;background:#c0392b;color:#fff;font:700 11px/1 var(--sans);padding:5px 7px;border-radius:4px}
.pv .cjk{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.66);color:#ffd166;font:500 11px/1 var(--sans);padding:5px 7px;border-radius:4px}.pv .cjk.poor{color:#ff8a80}
.card:has(.ban){opacity:.55}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:15px;font-weight:700;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px 10px;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline}
.tab .n{font:500 12px var(--mono)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
[hidden]{display:none!important}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.snd{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.srow{display:flex;gap:12px;align-items:center}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--c-sound);color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center}
.play[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wave{flex:1;height:46px;position:relative;cursor:pointer;min-width:0}
.wave svg{width:100%;height:100%;display:block}
.wave .bg{fill:var(--line)}.wave .fg{fill:var(--c-sound)}
.snd h3{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.snd .sub{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.snd p{margin:0;font-size:13px;color:var(--muted)}
.snd details{font-size:13px}.snd details .body p,.snd details .body li{font-size:13px}
.shint{font-size:13px;color:var(--muted);margin:0}
.grrec{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.grrec span{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.grrec b{font-weight:700}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ba{position:relative;aspect-ratio:9/16;background:var(--well);overflow:hidden;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ba .af{clip-path:inset(0 0 0 50%)}
.ba .ln{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none}
.ba .tg{position:absolute;bottom:8px;font:600 11px/1 var(--sans);color:#fff;background:rgba(0,0,0,.55);padding:4px 6px;border-radius:4px}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.gcard .cb p{-webkit-line-clamp:4}
.rec{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%}.flab{font-size:12px;color:var(--muted);letter-spacing:.08em;min-width:56px}
</style>

<div class="wrap">
 <header>
  <h1>video-fx 效果庫<small id="sub" class="tc"></small></h1>
  <div class="stats" id="stats"></div>
 </header>
 <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="fx" id="tabfx"></button><button class="tab" role="tab" data-tab="sfx" id="tabsfx"></button><button class="tab" role="tab" data-tab="grade" id="tabgr"></button></div>
 <section id="sfxView" hidden>
  <div class="bar" role="toolbar" aria-label="聲效篩選" style="margin-bottom:16px">
   <div id="scats" style="display:flex;flex-wrap:wrap;gap:8px"></div>
   <div class="search"><input id="sq" type="search" placeholder="搜尋：轉場、醫療、FX-040…" aria-label="搜尋聲效"></div>
  </div>
  <p class="shint" style="margin-bottom:14px">撳 ▶ 試聽；撳波形可以跳位。音量以手機喇叭為準，建議先戴耳機聽。「配搭效果」撳落去會跳去嗰個視覺效果。</p>
  <div class="sgrid" id="sgrid"></div>
 </section>
 <section id="grView" hidden>
  <p class="shint" style="margin-bottom:10px">每條片都會按影片類型自動推薦基本調色（冇特別要求就用推薦）。拖動滑桿比較原片同調色後；樣本係你自己嘅醫生片段。</p>
  <div id="grRec" class="grrec"></div>
  <div class="ggrid" id="ggrid"></div>
 </section>
 <section id="fxView" style="display:flex;flex-direction:column;gap:22px">
 <div class="bar" role="toolbar" aria-label="篩選">
  <div id="cats" style="display:flex;flex-wrap:wrap;gap:8px"></div>
  <div class="frow"><span class="flab">影片類型</span><div id="vts" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>
  <div class="frow"><span class="flab">節奏</span><div id="paces" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>
  <div class="search">
   <input id="q" type="search" placeholder="搜尋：醫療、暖色、字幕…" aria-label="搜尋效果">
   <select id="sort" aria-label="排序"><option value="id">按編號</option><option value="new">最新先</option></select>
  </div>
 </div>
 <div class="grid" id="grid"></div>
 </section>
 <footer id="foot"></footer>
</div>
<dialog id="dlg" aria-labelledby="dname"></dialog>

<script type="application/json" id="fxdata">/*__DATA__*/null</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('fxdata').textContent)||{effects:[]};
const FX=D.effects, byId=Object.fromEntries(FX.map(e=>[e.id,e]));
const GX=D.grades||[];
const SX=D.sounds||[], SBY={}; for(const s of SX) for(const p of s.pairs||[]) (SBY[p]??=[]).push(s);
const CAT={caption:'字幕（基本）','text-fx':'特效字',hook:'開場',camera:'鏡頭',cutaway:'全屏過場','list-chart':'清單／卡片',layout:'版面',transition:'轉場','grade-light':'調色／補光',accent:'點綴',sound:'聲效'};
const catName=c=>CAT[c]||c, cc=c=>`var(--c-${c},var(--muted))`;
const hasOld=new Set(FX.map(e=>e.learned)).size>1; const isNew=e=>hasOld&&e.learned===D.latest;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s), h=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={cat:'all',vt:'all',pace:'all',q:'',sort:'id',tab:'fx',scat:'all',sq:''};
try{const s=JSON.parse(localStorage.getItem('vfx-state')||'null'); if(s) state={...state,...s,q:'',sq:''};}catch(e){}
const save=()=>{try{localStorage.setItem('vfx-state',JSON.stringify({cat:state.cat,vt:state.vt,pace:state.pace,sort:state.sort,tab:state.tab,scat:state.scat}));}catch(e){}};
const cats=[...new Set(FX.map(e=>e.cat))];
const refs=new Set(FX.map(e=>(e.source.match(/^(ref[\w-]+)/)||[])[1]).filter(Boolean));
$('#sub').textContent=`${FX.length} 個效果 · 更新 ${D.generated}`;
$('#stats').innerHTML=[[FX.length,'效果'],[cats.length,'類別'],[refs.size,'參考片'],[hasOld?FX.filter(isNew).length:FX.length,hasOld?'最近新增':'首批效果'],[(D.sounds||[]).length,'聲效']].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
function renderCats(){
 const all=`<button class="chip" data-c="all" aria-pressed="${state.cat==='all'}">全部 <span class="n">${FX.length}</span></button>`;
 $('#cats').innerHTML=all+cats.map(c=>`<button class="chip" data-c="${h(c)}" aria-pressed="${state.cat===c}"><span class="dot" style="--cc:${cc(c)}"></span>${h(catName(c))} <span class="n">${FX.filter(e=>e.cat===c).length}</span></button>`).join('');
}
function media(e,big){
 const wide=/hstack|FX-011|FX-015/.test(e.id)||e.wide;
 if(e.vid) return {wide,html:`<video src="${e.vid}" ${e.img?`poster="${e.img}"`:''} muted loop playsinline ${reduce?'':'autoplay'} preload="metadata" ${big?'controls':''} aria-label="${h(e.name)} 預覽"></video>`};
 if(e.img) return {wide,html:`<img src="${e.img}" alt="${h(e.name)} 預覽">`};
 return {wide,html:''};
}
function match(e){
 if(state.cat!=='all'&&e.cat!==state.cat) return false;
 if(state.vt!=='all'&&!(e.vtypes||[]).includes(state.vt)) return false;
 if(state.pace!=='all'&&!(e.pace||[]).includes(state.pace)) return false;
 if(!state.q) return true;
 const hay=[e.id,e.name,e.en,catName(e.cat),e.summary,e.source,...e.tags,...e.mood,...e.fits].join(' ').toLowerCase();
 return state.q.toLowerCase().split(/\s+/).every(t=>hay.includes(t));
}
function renderGrid(){
 let list=FX.filter(match);
 if(state.sort==='new') list=[...list].sort((a,b)=>b.learned.localeCompare(a.learned)||b.id.localeCompare(a.id));
 $('#grid').innerHTML=list.length?list.map(e=>{const m=media(e);return `<button class="card" data-id="${e.id}" aria-label="${h(e.id+' '+e.name)}">
  <div class="pv ${m.wide?'wide':''}">${m.html}<span class="tcode">${e.id}</span>${isNew(e)?'<span class="new">NEW</span>':''}${e.status==='banned'?'<span class="ban">禁用</span>':''}${e.cjk_fit&&e.cjk_fit!=='good'?`<span class="cjk ${e.cjk_fit}">${e.cjk_fit==='poor'?'中文唔適合':'中文要調整'}</span>`:''}</div>
  <div class="cb"><span class="cat"><span class="dot" style="--cc:${cc(e.cat)}"></span>${h(catName(e.cat))} · ${h(e.diff)}</span>
  <h3>${h(e.name)}</h3><p>${h(e.summary)}</p>
  <div class="tags">${e.mood.slice(0,3).map(t=>`<span class="tag">${h(t)}</span>`).join('')}</div></div></button>`}).join('')
  :`<div class="empty">冇符合嘅效果。試下換個關鍵字，或者撳「全部」。</div>`;
 $('#foot').textContent=`顯示 ${list.length} / ${FX.length} 個效果。撳卡片睇詳情、參數同代碼。`;
}
function chips(ids,bad){return ids.length?ids.map(id=>{const t=byId[id];return `<button class="lk ${bad?'bad':''}" ${bad?'disabled':''} data-go="${id}"><span class="dot" style="--cc:${cc(t?t.cat:'')}"></span>${id} ${h(t?t.name:'')}</button>`}).join(''):'<span style="color:var(--muted)">—</span>';}
function open(id){
 const e=byId[id]; if(!e) return; const m=media(e,true), d=$('#dlg');
 d.innerHTML=`<div class="dl"><div class="media">${m.html}</div><div class="info">
  <div class="dhead"><div><span class="cat"><span class="dot" style="--cc:${cc(e.cat)}"></span>${h(catName(e.cat))} · <span class="tc">${e.id}</span> · <span class="tc">${h(e.en)}</span></span><h2 id="dname">${h(e.name)}</h2></div>
  <button class="close" id="x" aria-label="關閉">✕</button></div>
  <p class="lead">${h(e.summary)}</p>
  <dl class="meta"><dt>情緒</dt><dd>${h(e.mood.join('、'))||'—'}</dd><dt>適合</dt><dd>${h(e.fits.join('、'))||'—'}</dd>
  <dt>需要</dt><dd>${h(e.needs.join('、'))||'—'}</dd><dt>難度</dt><dd>${h(e.diff)}</dd><dt>影片類型</dt><dd>${h((e.vtypes||[]).join('、'))||'—'}</dd><dt>節奏</dt><dd>${h((e.pace||[]).join('、'))||'—'}</dd>
  <dt>出處</dt><dd class="tc">${h(e.source)}</dd><dt>用過</dt><dd>${h(e.used.join('、'))||'—'}</dd><dt>學習日期</dt><dd class="tc">${h(e.learned)}</dd><dt>中文適應</dt><dd>${h({good:'適合',adjust:'要調整',poor:'唔適合'}[e.cjk_fit]||'—')}${e.cjk_notes?'：'+h(e.cjk_notes):''}</dd>${e.placement?`<dt>擺位</dt><dd>${h(e.placement)}</dd>`:''}${e.status==='banned'?`<dt>狀態</dt><dd style="color:#c0392b">禁用：${h(e.banned_reason||'')}</dd>`:''}</dl>
  <div><div class="cat" style="margin-bottom:6px">最夾嘅效果</div><div class="links">${chips(e.pairs)}</div></div>
  ${(SBY[e.id]||[]).length?`<div><div class="cat" style="margin-bottom:6px">配聲效</div><div class="links">${SBY[e.id].map(s=>`<button class="lk" data-sgo="${s.id}"><span class="dot" style="--cc:var(--c-sound)"></span>${s.id} ${h(s.name)}</button>`).join('')}</div></div>`:''}
  ${e.conf.length?`<div><div class="cat" style="margin-bottom:6px">避免同時用</div><div class="links">${chips(e.conf,true)}</div></div>`:''}
  <div class="body">${e.body}</div>
  ${e.snippet?`<details><summary>HyperFrames 代碼</summary><button class="copy" id="cp">複製代碼</button><pre><code>${h(e.snippet)}</code></pre></details>`:''}
 </div></div>`;
 if(!d.open) d.showModal();
 d.querySelector('.info').scrollTop=0;
 try{history.replaceState(null,'','#'+id);}catch(_){}
}
document.addEventListener('click',ev=>{
 const c=ev.target.closest('[data-c]'); if(c){state.cat=c.dataset.c;save();renderCats();renderGrid();return;}
 const v=ev.target.closest('[data-vt]'); if(v){state.vt=v.dataset.vt;save();renderFilters();renderGrid();return;}
 const pc=ev.target.closest('[data-pace]'); if(pc){state.pace=pc.dataset.pace;save();renderFilters();renderGrid();return;}
 const card=ev.target.closest('.card'); if(card){open(card.dataset.id);return;}
 const go=ev.target.closest('[data-go]'); if(go&&!go.disabled){open(go.dataset.go);return;}
 if(ev.target.id==='x'){ $('#dlg').close(); return; }
 if(ev.target.id==='cp'){const b=ev.target,t=b.nextElementSibling.textContent;
  navigator.clipboard.writeText(t).then(()=>{b.textContent='已複製';setTimeout(()=>b.textContent='複製代碼',1500);},()=>{const r=document.createRange();r.selectNodeContents(b.nextElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='已選取，請按 ⌘C';});}
});
$('#dlg').addEventListener('click',ev=>{if(ev.target.id==='dlg')ev.target.close();});
$('#dlg').addEventListener('close',()=>{try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}});
$('#q').addEventListener('input',ev=>{state.q=ev.target.value.trim();renderGrid();});
$('#sort').value=state.sort; $('#sort').addEventListener('change',ev=>{state.sort=ev.target.value;save();renderGrid();});
const VTS=['口播知識','訪問對談','醫療健康','動畫解說','產品廣告','紀錄 Vlog','新聞資訊','品牌企業'].filter(t=>FX.some(e=>(e.vtypes||[]).includes(t)));
const PACES=[['快','快（1–2 秒一剪）'],['中','中（2–4 秒）'],['慢','慢（4 秒以上）']];
function renderFilters(){
 const cnt=(k,v)=>FX.filter(e=>(e[k]||[]).includes(v)).length;
 $('#vts').innerHTML=`<button class="chip" data-vt="all" aria-pressed="${state.vt==='all'}">全部</button>`+VTS.map(t=>`<button class="chip" data-vt="${h(t)}" aria-pressed="${state.vt===t}">${h(t)} <span class="n">${cnt('vtypes',t)}</span></button>`).join('');
 $('#paces').innerHTML=`<button class="chip" data-pace="all" aria-pressed="${state.pace==='all'}">全部</button>`+PACES.map(([v,l])=>`<button class="chip" data-pace="${v}" aria-pressed="${state.pace===v}">${h(l)} <span class="n">${cnt('pace',v)}</span></button>`).join('');
}
// ---------- 聲效 ----------
const SCAT={whoosh:'轉場風聲',pop:'彈出',ui:'介面',ding:'提示音',impact:'重擊',riser:'張力',foley:'擬音',accent:'點綴',music:'背景音樂',ambience:'環境聲'};
const scats=[...new Set(SX.map(s=>s.cat))];
$('#tabfx').innerHTML=`視覺效果 <span class="n">${FX.length}</span>`; $('#tabsfx').innerHTML=`聲效 <span class="n">${SX.length}</span>`; $('#tabgr').innerHTML=`調色 <span class="n">${GX.length}</span>`;
function setTab(t){state.tab=t;save();
 $('#tabfx').setAttribute('aria-selected',t==='fx'); $('#tabsfx').setAttribute('aria-selected',t==='sfx'); $('#tabgr').setAttribute('aria-selected',t==='grade');
 $('#fxView').hidden=t!=='fx'; $('#sfxView').hidden=t!=='sfx'; $('#grView').hidden=t!=='grade';
 if(t==='fx') renderGrid(); else if(t==='grade') $('#foot').textContent=`${GX.length} 款調色預設 · 由 tools/grade.py 套用（先自動校正白平衡同黑白位，再套風格）。`; else $('#foot').textContent=`${SX.length} 個聲效 · 全部自製合成或已註明授權，可以直接用喺客戶片。`;
 if(t!=='sfx') stopAll();}
function waveSvg(pk,id){const n=pk.length||1,w=100/n;
 const bars=pk.map((p,i)=>{const hh=Math.max(4,p*100);return `<rect x="${(i*w+w*.18).toFixed(2)}" y="${((100-hh)/2).toFixed(2)}" width="${(w*.64).toFixed(2)}" height="${hh.toFixed(2)}" rx="0.6"/>`}).join('');
 return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><clipPath id="c${id}"><rect id="r${id}" x="0" y="0" width="0" height="100"/></clipPath><g class="bg">${bars}</g><g class="fg" clip-path="url(#c${id})">${bars}</g></svg>`;}
function smatch(s){ if(state.scat!=='all'&&s.cat!==state.scat) return false; if(!state.sq) return true;
 const hay=[s.id,s.name,s.en,SCAT[s.cat]||s.cat,s.summary,...s.mood,...s.pairs,...s.pairs.map(p=>byId[p]?.name||'')].join(' ').toLowerCase();
 return state.sq.toLowerCase().split(/\s+/).every(t=>hay.includes(t));}
function renderSounds(){
 if(state.scat!=='all'&&!scats.includes(state.scat)) state.scat='all';
 $('#scats').innerHTML=`<button class="chip" data-sc="all" aria-pressed="${state.scat==='all'}">全部 <span class="n">${SX.length}</span></button>`+scats.map(c=>`<button class="chip" data-sc="${h(c)}" aria-pressed="${state.scat===c}">${h(SCAT[c]||c)} <span class="n">${SX.filter(s=>s.cat===c).length}</span></button>`).join('');
 const list=SX.filter(smatch);
 $('#sgrid').innerHTML=list.length?list.map(s=>`<article class="snd" id="snd-${s.id}">
  <div class="srow"><button class="play" data-play="${s.id}" aria-pressed="false" aria-label="播放 ${h(s.name)}">▶</button><div class="wave" data-seek="${s.id}">${waveSvg(s.peaks||[],s.id)}</div></div>
  <div><span class="cat"><span class="dot" style="--cc:var(--c-sound)"></span>${h(SCAT[s.cat]||s.cat)} · <span class="tc">${s.id}</span> · <span class="tc">${(+s.dur).toFixed(2)}s</span> · 音量 <span class="tc">${h(s.vol)}</span></span><h3>${h(s.name)} <span class="tc" style="font-weight:400;font-size:12px;color:var(--muted)">${h(s.en)}</span></h3></div>
  <p>${h(s.summary)}</p>
  <div class="sub"><span>節奏：${h(s.pace.join('、'))}</span><span>情緒：${h(s.mood.join('、'))||'—'}</span></div>
  ${s.pairs.length?`<div class="links">${chips(s.pairs)}</div>`:''}
  <details><summary>用法同授權</summary><div class="body">${s.body}</div><p style="margin-top:6px">來源：${h(s.source)}<br>授權：${h(s.license)}</p></details>
 </article>`).join(''):`<div class="empty">冇符合嘅聲效。</div>`;}
const players={}; let raf=0;
function stopAll(){for(const k in players){players[k].pause();players[k].currentTime=0;paint(k,0);const b=document.querySelector(`[data-play="${k}"]`);if(b){b.textContent='▶';b.setAttribute('aria-pressed','false');}}}
function paint(id,f){const r=document.getElementById('r'+id); if(r) r.setAttribute('width',(f*100).toFixed(2));}
function tick(){let any=false;for(const k in players){const a=players[k];if(!a.paused){any=true;paint(k,a.currentTime/(a.duration||1));}}raf=any?requestAnimationFrame(tick):0;}
function play(id,at){const s=SX.find(x=>x.id===id); if(!s||!s.audio) return;
 for(const k in players) if(k!==id){players[k].pause();players[k].currentTime=0;paint(k,0);const b=document.querySelector(`[data-play="${k}"]`);if(b){b.textContent='▶';b.setAttribute('aria-pressed','false');}}
 const a=players[id]||(players[id]=new Audio(s.audio)); const b=document.querySelector(`[data-play="${id}"]`);
 a.onended=()=>{paint(id,1);setTimeout(()=>paint(id,0),250);if(b){b.textContent='▶';b.setAttribute('aria-pressed','false');}};
 if(at!=null){a.currentTime=at*(a.duration||s.dur);} else if(!a.paused){a.pause();a.currentTime=0;paint(id,0);if(b){b.textContent='▶';b.setAttribute('aria-pressed','false');}return;} else a.currentTime=0;
 a.play().then(()=>{if(b){b.textContent='■';b.setAttribute('aria-pressed','true');} if(!raf) raf=requestAnimationFrame(tick);}).catch(()=>{});}
function goSound(id){ if($('#dlg').open) $('#dlg').close(); state.scat='all'; state.sq=''; $('#sq').value=''; renderSounds(); setTab('sfx');
 const el=document.getElementById('snd-'+id); if(el){el.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'}); el.style.outline='2px solid var(--accent)'; setTimeout(()=>el.style.outline='',1600); play(id);} }
document.addEventListener('click',ev=>{
 const tb=ev.target.closest('[data-tab]'); if(tb){setTab(tb.dataset.tab);return;}
 const sc=ev.target.closest('[data-sc]'); if(sc){state.scat=sc.dataset.sc;save();renderSounds();return;}
 const pl=ev.target.closest('[data-play]'); if(pl){play(pl.dataset.play);return;}
 const sk=ev.target.closest('[data-seek]'); if(sk){const r=sk.getBoundingClientRect();play(sk.dataset.seek,Math.min(.98,Math.max(0,(ev.clientX-r.left)/r.width)));return;}
 const sg=ev.target.closest('[data-sgo]'); if(sg){goSound(sg.dataset.sgo);return;}
 if(ev.target.closest('#sfxView [data-go]')){ev.stopImmediatePropagation(); stopAll(); setTab('fx'); open(ev.target.closest('[data-go]').dataset.go);}
},true);
$('#sq').addEventListener('input',ev=>{state.sq=ev.target.value.trim();renderSounds();});
function renderGrades(){
 const VT=['醫療健康','口播知識','訪問對談','動畫解說','產品廣告','紀錄 Vlog','新聞資訊','品牌企業'];
 $('#grRec').innerHTML='<span><b>推薦</b></span>'+VT.map(v=>{const g=GX.find(x=>(x.deflt||[]).includes(v));return g?`<span>${h(v)} → <b>${g.id} ${h(g.name)}</b></span>`:''}).join('');
 $('#ggrid').innerHTML=GX.map(g=>`<article class="gcard"><div class="ba">${D.gradeBefore?`<img src="${D.gradeBefore}" alt="原片">`:''}${g.after?`<img class="af" src="${g.after}" alt="${h(g.name)}">`:''}<i class="ln"></i><span class="tg" style="left:8px">原片</span><span class="tg" style="right:8px">${h(g.name)}</span><input type="range" min="0" max="100" value="50" aria-label="比較 ${h(g.name)}" data-ba></div>
  <div class="cb"><span class="cat"><span class="dot" style="--cc:var(--c-grade-light)"></span>調色 · <span class="tc">${g.id}</span></span><h3>${h(g.name)}${(g.deflt||[]).length?'<span class="rec">預設</span>':''}</h3><p>${h(g.summary)}</p>
  <div class="tags">${(g.deflt||[]).map(t=>`<span class="tag">推薦：${h(t)}</span>`).join('')}${(g.mood||[]).map(t=>`<span class="tag">情緒：${h(t)}</span>`).join('')}</div>
  <details><summary>用法同參數</summary><div class="body">${g.body}</div><pre><code>${h(g.filters)}</code></pre></details></div></article>`).join('');
}
document.addEventListener('input',ev=>{const r=ev.target.closest('[data-ba]');if(!r)return;const box=r.parentElement,v=r.value;box.querySelector('.af').style.clipPath=`inset(0 0 0 ${v}%)`;box.querySelector('.ln').style.left=v+'%';});
renderCats(); renderFilters(); renderGrid(); renderSounds(); renderGrades();
const hid=location.hash.slice(1);
if(SX.some(s=>s.id===hid)) goSound(hid); else if(GX.some(g=>g.id===hid)) setTab('grade'); else { setTab(byId[hid]?'fx':(['fx','sfx','grade'].includes(state.tab)?state.tab:'fx')); if(byId[hid]) open(hid); }
})();
</script>
