<!doctype html>
<html><head><meta charset="utf-8" />
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap");
html,body{margin:0;background:transparent}
#mg_spine{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans TC",sans-serif;color:#0B2A3A}
#mg_spine .bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 38%,#FFFFFF 0%,#EAF3FB 55%,#D3E5F4 100%)}
#mg_spine .title{position:absolute;left:0;right:0;top:385px;text-align:center;font:900 96px/1.1 "Noto Sans TC",sans-serif;color:#0B2A3A;opacity:0;z-index:20;white-space:nowrap}
#mg_spine .title em{font-style:normal;color:#1A80D0}
#mg_spine .pills{position:absolute;left:52px;right:52px;top:1265px;display:flex;justify-content:center;gap:22px;z-index:20}
#mg_spine .pill{padding:12px 36px 18px;border-radius:999px;background:linear-gradient(180deg,#3B97E0,#1A80D0);color:#fff;font:900 76px/1 "Noto Sans TC",sans-serif;border:4px solid rgba(255,255,255,.92);box-shadow:0 12px 28px rgba(11,42,58,.22);opacity:0;white-space:nowrap}
#mg_spine .pill.dark{background:linear-gradient(180deg,#6A6A6A,#545454)}
#mg_spine .pill.red{background:linear-gradient(180deg,#E8474E,#C81F28)}
#mg_spine .mark{position:absolute;height:0;border-top:7px dashed #1A80D0;opacity:0;z-index:6}
/* 椎骨／樓層 */
#mg_spine .fl{position:absolute;left:-230px;width:460px;height:118px;transform-origin:50% 100%}
#mg_spine .fl .body{position:absolute;inset:0;border-radius:44px;background:linear-gradient(180deg,#FFFDF8 0%,#F6EBDA 45%,#E6D3B6 100%);
  box-shadow:inset 0 10px 14px rgba(255,255,255,.9),inset 0 -14px 18px rgba(160,120,70,.22),0 14px 24px rgba(11,42,58,.16)}
#mg_spine .fl .wing{position:absolute;top:34px;width:120px;height:52px;border-radius:26px;background:linear-gradient(180deg,#FBF4E8,#E2CDAE);box-shadow:inset 0 -6px 8px rgba(160,120,70,.2),0 6px 12px rgba(11,42,58,.12)}
#mg_spine .fl .wing.l{left:-92px} #mg_spine .fl .wing.r{right:-92px}
#mg_spine .fl .win{position:absolute;top:34px;width:74px;height:50px;border-radius:14px;background:linear-gradient(160deg,#BFE4FA 0%,#7DBDE8 55%,#4F98CF 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -4px 6px rgba(20,60,110,.25)}
#mg_spine .fl .glow{position:absolute;inset:0;border-radius:44px;background:linear-gradient(180deg,#FFF3B0,#FFDE59 55%,#F2C230);opacity:0}
#mg_spine .disc{position:absolute;left:-150px;width:300px;height:22px;border-radius:11px;background:linear-gradient(180deg,#CFEAFB,#8CC6EC);box-shadow:inset 0 3px 0 rgba(255,255,255,.7)}
#mg_spine .roof{position:absolute;left:-250px;width:500px;height:34px;border-radius:17px;background:linear-gradient(180deg,#4DA3E6,#1A80D0 60%,#1468AE);box-shadow:0 10px 18px rgba(26,128,208,.35)}
#mg_spine .shadow{position:absolute;left:-330px;top:-20px;width:660px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(11,42,58,.28),rgba(11,42,58,0))}
#mg_spine .dust{position:absolute;width:16px;height:16px;border-radius:50%;background:#FFDE59;opacity:0}
#mg_spine #bld{position:absolute;left:540px;top:1215px;width:0;height:0;transform:scale(0.85)}
</style></head>
<body>
<div id="mg_spine" data-composition-id="mg_spine" data-start="0" data-width="1080" data-height="1920">
  <div class="bg"></div>
<div class="title"><em>脊椎塌陷</em></div><div class="mark" style="left:240px;width:600px"></div><div id="bld"><div class="shadow"></div></div><div class="pills"><div class="pill p1">駝背</div><div class="pill dark p2">變矮</div></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
var ROOT=document.querySelector('[data-composition-id="mg_spine"]');
var DUR=+ROOT.dataset.dur||5.9; var CUES=(ROOT.dataset.cues||'').split(',').filter(Boolean).map(Number);
function c(i,d){return CUES.length>i?CUES[i]:d;}
function q(s){return ROOT.querySelector(s);} function qa(s){return ROOT.querySelectorAll(s);}
var tl=gsap.timeline({paused:true});
if(!ROOT.dataset.noin) tl.fromTo(q('.bg'),{opacity:0},{opacity:1,duration:0.3},0);
function pill(el,t){ tl.fromTo(el,{opacity:0,y:30,scale:0.7},{opacity:1,y:0,scale:1,duration:0.45,ease:'back.out(1.8)'},t); }
// 疊樓工具：喺 B（容器）入面由下而上砌 N 層，回傳每層資料
function stack(B,N,wins){ var y=0,F=[];
  for(var i=0;i<N;i++){ var d=document.createElement('div'); d.className='disc'; B.appendChild(d);
    var f=document.createElement('div'); f.className='fl';
    f.innerHTML='<div class="wing l"></div><div class="wing r"></div><div class="body"></div><div class="glow"></div>'+(wins?[0,1,2,3].map(function(k){return '<div class="win" style="left:'+(52+k*94)+'px"></div>'}).join(''):'');
    B.appendChild(f); y+=22; d.style.top=(-y)+'px'; y+=118; f.style.top=(-y)+'px'; F.push({f:f,d:d,top:y}); }
  return {F:F,h:y}; }
function squash(F,ks,t){ ks.forEach(function(k){ tl.to(F[k].f,{scaleY:0.48,scaleX:1.1,duration:0.7,ease:'power2.inOut'},t); tl.to(F[k].f.querySelector('.glow'),{opacity:0.85,duration:0.5},t+0.15); });
  var loss=0; F.forEach(function(o,i){ var d=0; ks.forEach(function(k){ if(i>k) d+=118*0.52; }); if(d){ tl.to([o.f,o.d],{y:d,duration:0.7,ease:'power2.inOut'},t); } });
  ks.forEach(function(){loss+=118*0.52}); return loss; }
function dust(B,F,k,t){ for(var p=0;p<10;p++){ var s=document.createElement('div'); s.className='dust'; s.style.left=(p%2?250:-266)+'px'; s.style.top=(-(F[k].top-60))+'px'; B.appendChild(s);
  tl.fromTo(s,{opacity:0.9,x:0,y:0,scale:1},{opacity:0,x:(p%2?1:-1)*(60+p*14),y:-30+p*9,scale:0.3,duration:0.7,ease:'power2.out'},t+p*0.02); } }

var B=q('#bld'); var S=stack(B,5,false);
q('.mark').style.top=(1215-S.h*0.85-16)+'px';
S.F.forEach(function(o,i){ tl.fromTo([o.f,o.d],{y:-700,opacity:0},{y:0,opacity:1,duration:0.45,ease:'bounce.out'},0.2+i*0.16); });
tl.to(q('.mark'),{opacity:1,duration:0.3},1.2);
squash(S.F,[1,2],c(0,3.0)-0.3); dust(B,S.F,2,c(0,3.0)); tl.fromTo(q('.title'),{opacity:0,y:-24,scale:1.2},{opacity:1,y:0,scale:1,duration:0.45,ease:'back.out(1.8)'},c(0,3.0));
tl.to(B,{rotation:14,duration:0.8,ease:'power2.inOut',transformOrigin:'0px 0px'},c(1,5.3)-0.35); pill(q('.p1'),c(1,5.3));
tl.to(q('.mark'),{borderTopColor:'#545454',duration:0.2},c(2,6.6)-0.1); tl.fromTo(B,{x:0},{x:8,duration:0.05,yoyo:true,repeat:5},c(2,6.6)-0.1); pill(q('.p2'),c(2,6.6));

if(!ROOT.dataset.nofade) tl.to(ROOT.children,{opacity:0,duration:0.25,ease:'power2.in'},DUR-0.27);
tl.set({}, {}, DUR);
window.__timelines["mg_spine"]=tl;
})();
</script>
</body></html>
