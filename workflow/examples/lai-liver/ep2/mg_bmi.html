<!doctype html>
<html><head><meta charset="utf-8" />
<!-- ep2 Q5「中國人不應該高過23，21、22都可以」：BMI 量尺（亞洲人分級：18.5／23／25，香港衞生署）；指針由紅區滑返綠區 21–22，23 有紅色上限線。場景自設，精緻 2D。 -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap");
html,body{margin:0;background:transparent}
#mgb{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans TC",sans-serif;color:#0B2A3A}
#mgb .bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 40%,#FFFFFF 0%,#EAF3FB 55%,#D3E5F4 100%)}
#mgb .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(26,128,208,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(26,128,208,.06) 2px,transparent 2px);background-size:90px 90px}
#mgb .title{position:absolute;left:0;right:0;top:400px;text-align:center;font:900 150px/1 "Noto Sans TC",sans-serif;color:#0B2A3A;letter-spacing:6px;opacity:0}
#mgb .title small{display:block;font:900 60px/1.3 "Noto Sans TC",sans-serif;color:#1A80D0;letter-spacing:2px;margin-top:14px}
#mgb .bar{position:absolute;left:90px;top:860px;width:900px;height:92px;border-radius:46px;overflow:hidden;box-shadow:inset 0 4px 0 rgba(255,255,255,.55),0 16px 30px rgba(11,42,58,.18);opacity:0}
#mgb .seg{position:absolute;top:0;bottom:0}
#mgb .seg::after{content:"";position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0))}
#mgb .tick{position:absolute;top:975px;width:200px;margin-left:-100px;text-align:center;font:900 76px/1 "Noto Sans TC",sans-serif;color:#0B2A3A;opacity:0}
#mgb .zone{position:absolute;top:1070px;width:300px;margin-left:-150px;text-align:center;font:900 52px/1 "Noto Sans TC",sans-serif;opacity:0}
#mgb .limit{position:absolute;top:790px;height:175px;width:10px;margin-left:-5px;border-radius:5px;background:repeating-linear-gradient(#E8452C 0 22px,transparent 22px 34px);opacity:0}
#mgb .limtag{position:absolute;top:700px;width:300px;margin-left:-150px;text-align:center}
#mgb .limtag span{display:inline-block;padding:10px 30px 16px;border-radius:999px;background:linear-gradient(180deg,#F26A52,#E8452C);color:#fff;font:900 60px/1 "Noto Sans TC",sans-serif;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 10px 22px rgba(232,69,44,.3);opacity:0}
#mgb .pin{position:absolute;top:1160px;width:150px;margin-left:-75px;height:190px;opacity:0}
#mgb .pin .tri{position:absolute;left:47px;top:0;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-bottom:44px solid #0B2A3A}
#mgb .pin svg{position:absolute;left:0;top:50px;width:150px;height:112px}
#mgb .ok{position:absolute;top:1150px;width:96px;height:96px;margin-left:56px;border-radius:50%;background:linear-gradient(180deg,#34C08A,#1F9D6B);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 10px 22px rgba(31,157,107,.35);opacity:0}
#mgb .ok svg{position:absolute;left:18px;top:20px;width:60px;height:60px}
</style></head>
<body>
<div id="mgb" data-composition-id="mgb" data-start="0" data-width="1080" data-height="1920">
  <div class="bg"></div><div class="grid"></div>
  <div class="title">BMI<small>中國人標準</small></div>
  <div class="bar"></div><div class="ticks"></div>
  <div class="limit"></div><div class="limtag"><span>上限 23</span></div>
  <div class="pin"><i class="tri"></i><svg viewBox="0 0 240 180"><defs><linearGradient id="bl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E07466"/><stop offset="1" stop-color="#B9483D"/></linearGradient></defs><path d="M16 66 C14 36 46 20 96 19 C146 18 198 24 226 38 C238 44 236 56 222 63 C198 76 168 90 142 110 C120 128 98 150 68 155 C38 160 18 134 16 104 Z" fill="url(#bl)"/><path d="M58 56 C80 40 124 34 158 42" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="10" stroke-linecap="round"/><circle cx="74" cy="80" r="10" fill="#2A1410"/><circle cx="108" cy="78" r="10" fill="#2A1410"/><path d="M80 98 Q92 110 104 97" fill="none" stroke="#2A1410" stroke-width="6" stroke-linecap="round"/></svg></div>
  <div class="ok"><svg viewBox="0 0 24 24"><path d="M4 12.5 L10 18 L20 6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
const ROOT=document.querySelector('[data-composition-id="mgb"]');
const DUR=+ROOT.dataset.dur||6.18; const C=(ROOT.dataset.cues||'0.2,2.3').split(',').map(Number);
const X=function(v){return 90+(v-15)*60;};   // 15–30 → 900px
const bar=ROOT.querySelector('.bar');
[[15,18.5,'linear-gradient(180deg,#B8DAF2,#8EC3E8)'],[18.5,23,'linear-gradient(180deg,#3DBB8A,#1F9D6B)'],[23,25,'linear-gradient(180deg,#FFE88A,#F5CC3C)'],[25,30,'linear-gradient(180deg,#F26A52,#E8452C)']].forEach(function(z){
  const d=document.createElement('div');d.className='seg';d.style.left=(X(z[0])-90)+'px';d.style.width=((z[1]-z[0])*60)+'px';d.style.background=z[2];bar.appendChild(d);});
const tk=ROOT.querySelector('.ticks');
[[18.5,'18.5'],[23,'23'],[25,'25']].forEach(function(t){const d=document.createElement('div');d.className='tick';d.style.left=X(t[0])+'px';d.textContent=t[1];tk.appendChild(d);});
[[20.75,'正常','#1F9D6B'],[27.5,'過重','#E8452C']].forEach(function(t){const d=document.createElement('div');d.className='zone';d.style.left=X(t[0])+'px';d.style.color=t[2];d.textContent=t[1];tk.appendChild(d);});
const lim=ROOT.querySelector('.limit'), lt=ROOT.querySelector('.limtag'); lim.style.left=X(23)+'px'; lt.style.left=X(23)+'px';
const pin=ROOT.querySelector('.pin'), ok=ROOT.querySelector('.ok'); pin.style.left=X(27.5)+'px'; ok.style.left=X(21.5)+'px';
const tl=gsap.timeline({paused:true});
tl.fromTo(ROOT.querySelector('.bg'),{opacity:0},{opacity:1,duration:.25},0)
  .fromTo(ROOT.querySelector('.title'),{opacity:0,y:40,scale:.9},{opacity:1,y:0,scale:1,duration:.4,ease:'back.out(1.7)'},0.05)
  .fromTo(bar,{opacity:0,scaleX:0,transformOrigin:'0% 50%'},{opacity:1,scaleX:1,duration:.55,ease:'power3.out'},0.15)
  .fromTo(ROOT.querySelectorAll('.tick'),{opacity:0,y:20},{opacity:1,y:0,duration:.3,stagger:.06,ease:'power2.out'},0.45)
  .fromTo(ROOT.querySelectorAll('.zone'),{opacity:0},{opacity:1,duration:.3,stagger:.06},0.6)
  .fromTo(pin,{opacity:0},{opacity:1,duration:.3},0.55)
  .fromTo(lim,{opacity:0,scaleY:0,transformOrigin:'50% 100%'},{opacity:1,scaleY:1,duration:.35,ease:'power3.out'},C[0]+0.25)
  .fromTo(lt.querySelector('span'),{opacity:0,scale:2.2,rotation:-8},{opacity:1,scale:1,rotation:-3,duration:.16,ease:'power4.in'},C[0]+0.45)
  .to(lt.querySelector('span'),{scale:1.06,duration:.07},C[0]+0.61).to(lt.querySelector('span'),{scale:1,duration:.1},C[0]+0.68)
  .to(pin,{x:X(21.5)-X(27.5),duration:1.0,ease:'power3.inOut'},C[1])
  .to(pin,{y:-16,duration:.14,yoyo:true,repeat:1,ease:'sine.out'},C[1]+1.0)
  .fromTo(ok,{opacity:0,scale:0},{opacity:1,scale:1,duration:.35,ease:'back.out(2.2)'},C[1]+1.05)
  .to(lim,{opacity:.55,duration:.35,yoyo:true,repeat:3,ease:'sine.inOut'},C[1]+1.5)
  .to(ROOT.querySelector('#mgb'),{opacity:0,duration:.25,ease:'power2.in'},DUR-.27).set({}, {}, DUR);
window.__timelines["mgb"]=tl;
})();
</script>
</body></html>
