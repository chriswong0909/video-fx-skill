<!doctype html>
<html><head><meta charset="utf-8" />
<!-- ep2 Q3：SPS 澱粉質食物組；逐步升起＋慢推；講到果糖時果汁位置紅圈脈動 -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap");
html,body{margin:0;background:transparent}
#sstarch{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans TC",sans-serif}
#sstarch .stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 70% at 50% 45%,#FFFFFF 0%,#EAF3FB 55%,#D3E5F4 100%)}
#sstarch .deco{position:absolute;border-radius:50%}
#sstarch .subj{position:absolute;left:110px;top:520px;width:860px;height:1075px;transform-origin:50% 92%}
#sstarch .subj img{width:100%;height:100%;object-fit:contain;display:block}
#sstarch .bigw{position:absolute;left:0;right:0;top:380px;text-align:center;opacity:0}
#sstarch .big{display:inline-block;padding:10px 30px 18px;border-radius:22px;background-color:rgba(255,255,255,.82);box-shadow:inset 0 3px 0 #fff,0 14px 30px rgba(11,42,58,.16);font:900 104px/1.15 "Noto Sans TC",sans-serif;color:#0B2A3A;letter-spacing:3px;white-space:nowrap;
  background-image:linear-gradient(#ffde59,#ffde59);background-repeat:no-repeat;background-position:30px 84%;background-size:0% 40%}
#sstarch .edge{position:absolute;left:0;right:0;top:-50px;height:8px;background:linear-gradient(90deg,rgba(26,128,208,.15),#1A80D0 50%,rgba(26,128,208,.15));box-shadow:0 0 22px rgba(26,128,208,.55);display:none}
#sstarch .ring{position:absolute;left:725px;top:1060px;width:200px;height:260px;border-radius:50%;border:10px solid #E8452C;opacity:0;box-shadow:0 0 24px rgba(232,69,44,.35)}
</style></head>
<body>
<div id="sstarch" data-composition-id="sstarch" data-start="0" data-width="1080" data-height="1920">
  <div class="stage"><div class="deco" style="left:70px;top:320px;width:110px;height:110px;background:rgba(255,222,89,.25)"></div><div class="deco" style="left:930px;top:300px;width:80px;height:80px;background:rgba(26,128,208,.10)"></div><div class="deco" style="left:90px;top:1450px;width:90px;height:90px;background:rgba(26,128,208,.10)"></div><div class="deco" style="left:920px;top:1500px;width:120px;height:120px;background:rgba(255,222,89,.22)"></div><div class="subj"><img src="assets/sps/starch_a.png" alt="" /></div><div class="ring"></div><div class="bigw"><span class="big">澱粉質最重要</span></div></div>
  <div class="edge"></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
const ROOT=document.querySelector('[data-composition-id="sstarch"]');
const DUR=+ROOT.dataset.dur||7.02; const C=(ROOT.dataset.cues||'1.35').split(',').map(Number);
const S=ROOT.querySelector('.subj'), BW=ROOT.querySelector('.bigw'), BG=ROOT.querySelector('.big'), ST=ROOT.querySelector('.stage');
const tl=gsap.timeline({paused:true});
tl.fromTo(ST,{clipPath:'inset(0 0 0% 0)'},{clipPath:'inset(0 0 0% 0)',duration:.35,ease:'power3.out'},0)
  .fromTo(ROOT.querySelector('.edge'),{scaleX:0},{scaleX:1,duration:.4,ease:'power3.out'},0.05)
  .fromTo(ROOT.querySelectorAll('.deco'),{scale:.5,opacity:0},{scale:1,opacity:1,duration:.5,stagger:.05,ease:'power2.out'},0.05)
  .to(ROOT.querySelectorAll('.deco'),{y:-40,duration:DUR,ease:'none'},0.05)
  .fromTo(BW,{opacity:0,y:30,scale:.92},{opacity:1,y:0,scale:1,duration:.35,ease:'back.out(1.7)'},C[0])
  .fromTo(BG,{backgroundSize:'0% 40%'},{backgroundSize:'calc(100% - 60px) 40%',duration:.45,ease:'power2.out'},C[0]+.3);
tl.fromTo(S,{y:260,opacity:0,scale:.9},{y:0,opacity:1,scale:1,duration:.55,ease:'back.out(1.5)'},0.05).to(S,{scale:1.06,duration:DUR-.8,ease:'none'},0.6).fromTo(ROOT.querySelector('.ring'),{opacity:0,scale:1.6},{opacity:1,scale:1,duration:.3,ease:'back.out(2)'},5.05).to(ROOT.querySelector('.ring'),{scale:1.08,duration:.3,yoyo:true,repeat:3,ease:'sine.inOut'},5.35);
tl.to(ROOT.querySelector('#sstarch'),{opacity:0,duration:.25,ease:'power2.in'},DUR-.27).set({}, {}, DUR);
window.__timelines["sstarch"]=tl;
})();
</script>
</body></html>
