<!doctype html>
<html><head><meta charset="utf-8" />
<!-- ep2 Q1：SPS 生成脂肪肝仔（白底，multiply 去白）；跌落＋肚腩擠壓回彈＋淡黃油滴背景；#38 螢光筆大字 -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap");
html,body{margin:0;background:transparent}
#sfat{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans TC",sans-serif}
#sfat .stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 70% at 50% 45%,#FFFFFF 0%,#EAF3FB 55%,#D3E5F4 100%)}
#sfat .deco{position:absolute;border-radius:50%}
#sfat .subj{position:absolute;left:170px;top:560px;width:740px;height:925px;transform-origin:50% 92%}
#sfat .subj img{width:100%;height:100%;object-fit:contain;display:block}
#sfat .bigw{position:absolute;left:0;right:0;top:380px;text-align:center;opacity:0}
#sfat .big{display:inline-block;padding:10px 30px 18px;border-radius:22px;background-color:rgba(255,255,255,.82);box-shadow:inset 0 3px 0 #fff,0 14px 30px rgba(11,42,58,.16);font:900 110px/1.15 "Noto Sans TC",sans-serif;color:#0B2A3A;letter-spacing:3px;white-space:nowrap;
  background-image:linear-gradient(#ffde59,#ffde59);background-repeat:no-repeat;background-position:30px 84%;background-size:0% 40%}
#sfat .edge{position:absolute;left:0;right:0;top:-50px;height:8px;background:linear-gradient(90deg,rgba(26,128,208,.15),#1A80D0 50%,rgba(26,128,208,.15));box-shadow:0 0 22px rgba(26,128,208,.55);display:none}

</style></head>
<body>
<div id="sfat" data-composition-id="sfat" data-start="0" data-width="1080" data-height="1920">
  <div class="stage"><div class="deco" style="left:60px;top:300px;width:120px;height:120px;background:rgba(243,207,122,.35)"></div><div class="deco" style="left:900px;top:520px;width:90px;height:90px;background:rgba(243,207,122,.30)"></div><div class="deco" style="left:80px;top:1350px;width:80px;height:80px;background:rgba(243,207,122,.28)"></div><div class="deco" style="left:930px;top:1240px;width:140px;height:140px;background:rgba(243,207,122,.25)"></div><div class="deco" style="left:470px;top:1560px;width:60px;height:60px;background:rgba(243,207,122,.3)"></div><div class="subj"><img src="assets/sps/fatty_a.png" alt="" /></div><div class="bigw"><span class="big">大半是肥的</span></div></div>
  <div class="edge"></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
const ROOT=document.querySelector('[data-composition-id="sfat"]');
const DUR=+ROOT.dataset.dur||2.76; const C=(ROOT.dataset.cues||'1.65').split(',').map(Number);
const S=ROOT.querySelector('.subj'), BW=ROOT.querySelector('.bigw'), BG=ROOT.querySelector('.big'), ST=ROOT.querySelector('.stage');
const tl=gsap.timeline({paused:true});
tl.fromTo(ST,{clipPath:'inset(0 0 0% 0)'},{clipPath:'inset(0 0 0% 0)',duration:.35,ease:'power3.out'},0)
  .fromTo(ROOT.querySelector('.edge'),{scaleX:0},{scaleX:1,duration:.4,ease:'power3.out'},0.05)
  .fromTo(ROOT.querySelectorAll('.deco'),{scale:.5,opacity:0},{scale:1,opacity:1,duration:.5,stagger:.05,ease:'power2.out'},0.05)
  .to(ROOT.querySelectorAll('.deco'),{y:-40,duration:DUR,ease:'none'},0.05)
  .fromTo(BW,{opacity:0,y:30,scale:.92},{opacity:1,y:0,scale:1,duration:.35,ease:'back.out(1.7)'},C[0])
  .fromTo(BG,{backgroundSize:'0% 40%'},{backgroundSize:'calc(100% - 60px) 40%',duration:.45,ease:'power2.out'},C[0]+.3);
tl.fromTo(S,{y:-700,opacity:0},{y:0,opacity:1,duration:.42,ease:'power2.in'},0.05).to(S,{scaleY:.86,scaleX:1.1,duration:.1,ease:'power2.out'},0.47).to(S,{scaleY:1,scaleX:1,duration:.5,ease:'elastic.out(1,.4)'},0.57).to(S,{scaleX:1.04,scaleY:.97,duration:.32,yoyo:true,repeat:5,ease:'sine.inOut'},1.1);
tl.to(ROOT.querySelector('#sfat'),{opacity:0,duration:.25,ease:'power2.in'},DUR-.27).set({}, {}, DUR);
window.__timelines["sfat"]=tl;
})();
</script>
</body></html>
