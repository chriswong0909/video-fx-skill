<!doctype html>
<html><head><meta charset="utf-8" />
<!-- ep2 Q8：SPS 康復肝仔；彈跳慶祝＋彩紙＋綠剔；大字保留限定詞「應該」 -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap");
html,body{margin:0;background:transparent}
#sheal{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;font-family:"Noto Sans TC",sans-serif}
#sheal .stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 70% at 50% 45%,#FFFFFF 0%,#EAF3FB 55%,#D3E5F4 100%)}
#sheal .deco{position:absolute;border-radius:50%}
#sheal .subj{position:absolute;left:170px;top:560px;width:740px;height:925px;transform-origin:50% 92%}
#sheal .subj img{width:100%;height:100%;object-fit:contain;display:block}
#sheal .bigw{position:absolute;left:0;right:0;top:380px;text-align:center;opacity:0}
#sheal .big{display:inline-block;padding:10px 30px 18px;border-radius:22px;background-color:rgba(255,255,255,.82);box-shadow:inset 0 3px 0 #fff,0 14px 30px rgba(11,42,58,.16);font:900 116px/1.15 "Noto Sans TC",sans-serif;color:#0B2A3A;letter-spacing:3px;white-space:nowrap;
  background-image:linear-gradient(#ffde59,#ffde59);background-repeat:no-repeat;background-position:30px 84%;background-size:0% 40%}
#sheal .edge{position:absolute;left:0;right:0;top:-50px;height:8px;background:linear-gradient(90deg,rgba(26,128,208,.15),#1A80D0 50%,rgba(26,128,208,.15));box-shadow:0 0 22px rgba(26,128,208,.55);display:none}
#sheal .ok{position:absolute;left:800px;top:600px;width:130px;height:130px;border-radius:50%;background:linear-gradient(180deg,#34C08A,#1F9D6B);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 10px 22px rgba(31,157,107,.35);opacity:0}#sheal .ok svg{position:absolute;left:26px;top:28px;width:78px;height:78px}
</style></head>
<body>
<div id="sheal" data-composition-id="sheal" data-start="0" data-width="1080" data-height="1920">
  <div class="stage"><div class="deco" style="left:120px;top:700px;width:26px;height:26px;background:#FFDE59"></div><div class="deco" style="left:930px;top:760px;width:22px;height:22px;background:#1F9D6B"></div><div class="deco" style="left:200px;top:1280px;width:20px;height:20px;background:#1A80D0"></div><div class="deco" style="left:860px;top:1300px;width:26px;height:26px;background:#FFDE59"></div><div class="deco" style="left:540px;top:560px;width:18px;height:18px;background:#1F9D6B"></div><div class="deco" style="left:80px;top:1000px;width:18px;height:18px;background:#1A80D0"></div><div class="deco" style="left:980px;top:1040px;width:20px;height:20px;background:#FFDE59"></div><div class="subj"><img src="assets/sps/healthy_a.png" alt="" /></div><div class="ok"><svg viewBox="0 0 24 24"><path d="M4 12.5 L10 18 L20 6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="bigw"><span class="big">應該可以</span></div></div>
  <div class="edge"></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
const ROOT=document.querySelector('[data-composition-id="sheal"]');
const DUR=+ROOT.dataset.dur||3.71; const C=(ROOT.dataset.cues||'0.16').split(',').map(Number);
const S=ROOT.querySelector('.subj'), BW=ROOT.querySelector('.bigw'), BG=ROOT.querySelector('.big'), ST=ROOT.querySelector('.stage');
const tl=gsap.timeline({paused:true});
tl.fromTo(ST,{clipPath:'inset(0 0 0% 0)'},{clipPath:'inset(0 0 0% 0)',duration:.35,ease:'power3.out'},0)
  .fromTo(ROOT.querySelector('.edge'),{scaleX:0},{scaleX:1,duration:.4,ease:'power3.out'},0.05)
  .fromTo(ROOT.querySelectorAll('.deco'),{scale:.5,opacity:0},{scale:1,opacity:1,duration:.5,stagger:.05,ease:'power2.out'},0.05)
  .to(ROOT.querySelectorAll('.deco'),{y:-40,duration:DUR,ease:'none'},0.05)
  .fromTo(BW,{opacity:0,y:30,scale:.92},{opacity:1,y:0,scale:1,duration:.35,ease:'back.out(1.7)'},C[0])
  .fromTo(BG,{backgroundSize:'0% 40%'},{backgroundSize:'calc(100% - 60px) 40%',duration:.45,ease:'power2.out'},C[0]+.3);
tl.fromTo(S,{y:300,opacity:0,scale:.8},{y:0,opacity:1,scale:1,duration:.45,ease:'back.out(1.8)'},0.05).to(S,{y:-60,duration:.24,yoyo:true,repeat:5,ease:'power1.out'},0.6).fromTo(ROOT.querySelector('.ok'),{opacity:0,scale:0,rotation:-30},{opacity:1,scale:1,rotation:0,duration:.35,ease:'back.out(2.2)'},1.0).to(ROOT.querySelectorAll('.deco'),{rotation:360,duration:DUR,ease:'none'},0.05);
tl.to(ROOT.querySelector('#sheal'),{opacity:0,duration:.25,ease:'power2.in'},DUR-.27).set({}, {}, DUR);
window.__timelines["sheal"]=tl;
})();
</script>
</body></html>
