<!-- FX-039 基本字幕 | 依賴：SansTC 700 | tl、PHRASES 由外部提供；有特效字嘅句子唔好放入 PHRASES -->
<!-- PHRASES=[[文字, 開始秒, 結束秒],...]；按意群斷句，每組 6–12 字，單行 -->
<style>
#fx039{position:absolute;left:60px;right:60px;top:1300px;height:120px;z-index:7;text-align:center}
#fx039 span{position:absolute;left:0;right:0;opacity:0;white-space:nowrap;
  font-family:"SansTC";font-weight:700;font-size:80px;line-height:1.3;color:#fff;
  text-shadow:0 0 5px rgba(0,0,0,.45),0 2px 12px rgba(0,0,0,.5)}
</style>
<div id="fx039"></div>
<script>
const box39=document.getElementById('fx039');
PHRASES.forEach(([w,a,b])=>{const s=document.createElement('span');s.textContent=w;box39.appendChild(s);
  if([...w].length>12) console.warn('FX-039 超過 12 字：',w);
  tl.set(s,{opacity:1},a);tl.from(s,{opacity:0,y:10,duration:.12,immediateRender:false},a);tl.set(s,{opacity:0},b);});
</script>
