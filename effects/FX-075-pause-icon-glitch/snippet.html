<script>/* tokens 讀取器（presets/README.md）*/window.EASE=window.EASE||(()=>{const g=(n,d)=>(getComputedStyle(document.documentElement).getPropertyValue('--ease-'+n).trim()||d);return{out:g('out','power3.out'),pop:g('pop','back.out(1.8)'),move:g('move','power2.inOut'),in:g('in','power2.in')}})();window.DUR=window.DUR||(()=>{const g=(n,d)=>{const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--'+n));return isNaN(v)?d:v};return{in:g('dur-in',.35),out:g('dur-out',.25),move:g('dur-move',.6),stagger:g('stagger',.08)}})();</script>
<!-- FX-075 暫停符號故障 | 1080×1920 | 冇外部依賴 | 要做成 clip -->
<style>
#fx075{position:absolute;inset:0;z-index:7;display:grid;place-items:center;backdrop-filter:blur(10px) brightness(.7)}
#fx075 .ic{position:relative;width:420px;height:420px;border:32px solid #fff;border-radius:50%;box-sizing:border-box;filter:drop-shadow(-4px 0 0 rgba(255,0,60,.8)) drop-shadow(4px 0 0 rgba(0,220,255,.8))}
#fx075 .ic i{position:absolute;top:95px;width:62px;height:166px;background:#fff}
</style>
<div id="fx075" class="clip" data-start="${T0}" data-duration="${DUR}" data-track-index="4"><div class="ic"><i style="left:95px"></i><i style="right:95px"></i></div></div>
<script>
const rnd075=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(75);
tl.from('#fx075 .ic',{scale:1.3,opacity:0,duration:.2,ease:EASE.out},T.start);
for(let t=T.start+.4;t<T.end-.3;t+=.4){const y=Math.round(rnd075()*300);
  tl.set('#fx075 .ic',{clipPath:`polygon(0 0,100% 0,100% ${y}px,0 ${y}px,0 ${y+40}px,100% ${y+40}px,100% 100%,0 100%)`,x:(rnd075()>.5?12:-12)},t);
  tl.set('#fx075 .ic',{clipPath:'none',x:0},t+.07);}
tl.to('#fx075 .ic',{x:20,opacity:0,duration:.3,ease:'steps(4)'},T.end-.3);
</script>
