<!-- FX-040 平滑推鏡 | 結構：#cam > #camInner(transform-origin 眼睛高度) > video；只郁 wrapper，唔好郁 video -->
<!-- 用喺重點句：由上一個機位 0.24 秒順滑推去下一個機位，代替硬切 -->
<script>
// FR：固定機位；SHOTS=[[開始,結束,'W'|'M'|'C','cut'|'smooth'],...]（剪接後時間軸）；EYE 由面部偵測得出
const FR={W:1.0,M:1.3,C:1.7}; const EYE=(typeof EYE_ORIGIN!=='undefined')?EYE_ORIGIN:'540px 640px';
tl.set('#camInner',{transformOrigin:EYE},0);
SHOTS.forEach(([a,b,f,how],i)=>{const S=FR[f]; const nx=SHOTS[i+1];
  const pushEnd=(nx&&nx[3]==='smooth')?nx[0]-.12:b;                    // 下一鏡係 smooth：鏡內慢推提早收，避免同一屬性重疊
  if(how==='smooth'){
    tl.to('#camInner',{scale:S,duration:.24,ease:'power2.inOut'},a-.12);
    if(pushEnd-(a+.12)>.05) tl.to('#camInner',{scale:S*1.03,duration:pushEnd-(a+.12),ease:'none'},a+.12);
  }else{
    tl.set('#camInner',{scale:S},a); if(pushEnd-a>.05) tl.to('#camInner',{scale:S*1.03,duration:pushEnd-a,ease:'none'},a);
  }});
</script>
