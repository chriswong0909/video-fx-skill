<!-- FX-001 兩層金色斜體字幕 | 依賴：SerifTC 900, SansTC 300 | tl, T 由外部提供 -->
<style>
.fx001{position:absolute;left:40px;right:40px;top:1180px;display:flex;flex-direction:column;align-items:center;opacity:0;z-index:7}
.fx001 .sm{font-family:"SansTC";font-weight:300;font-size:58px;color:#fff;text-shadow:0 2px 14px rgba(40,20,10,.6)}
.fx001 .gold{font-family:"SerifTC";font-weight:900;font-size:150px;line-height:1.08;padding:0 20px}
.fx001 .gold .c{display:inline-block;background:linear-gradient(180deg,var(--g1,#ffe08a),var(--g2,#f7a82a) 55%,var(--g3,#d9620b));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 10px rgba(80,30,0,.45));transform:skewX(-10deg)}
</style>
<div class="fx001" id="capA"><div><span class="w sm">有啲人</span><span class="w sm">以為自己</span></div>
 <div><span class="w gold"><span class="c">氣</span><span class="c">喘</span></span></div></div>
<script>
// words: [[selectorIndex, time]]
const A=document.querySelectorAll('#capA .w');
tl.set('#capA',{opacity:1},T.start); tl.set('#capA',{opacity:0},T.end);
tl.from(A[0],{opacity:0,y:24,filter:'blur(8px)',duration:.3},T.w0);
tl.from(A[1],{opacity:0,y:24,filter:'blur(8px)',duration:.3},T.w1);
tl.from(A[2].querySelectorAll('.c'),{opacity:0,y:50,scale:1.25,filter:'blur(10px)',duration:.45,ease:'power3.out',stagger:.07},T.w2);
</script>
