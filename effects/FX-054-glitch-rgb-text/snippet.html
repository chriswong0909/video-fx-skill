<!-- FX-054 故障大字 -->
<style>.fx054{position:absolute;left:0;right:0;top:700px;text-align:center;font:900 240px var(--f-body,'SansTC');z-index:7}
.fx054 .r{position:absolute;left:0;right:0;color:#ff2d55;mix-blend-mode:screen}.fx054 .c{position:absolute;left:0;right:0;color:#18e0ff;mix-blend-mode:screen}.fx054 .w{position:relative;color:#fff}</style>
<div class="fx054 clip" data-start="11" data-duration="1.2" data-track-index="4" style="position:absolute;inset:0;background:#111"><div class="fx054"><div class="r">辛苦</div><div class="c">辛苦</div><div class="w">辛苦</div></div></div>
<script>let s=5;const R=()=>{s=(s*16807)%2147483647;return s/2147483647;};
for(let k=0;k<6;k++){const t=T.start+k*.05;tl.set('.fx054 .r',{x:-6-R()*20,clipPath:`inset(${R()*60}% 0 ${R()*30}% 0)`},t);tl.set('.fx054 .c',{x:6+R()*20},t);}
tl.set('.fx054 .r',{x:-6,clipPath:'inset(0 0 0 0)'},T.start+.3);tl.set('.fx054 .c',{x:6},T.start+.3);</script>
