<!-- FX-007 紅條標題 -->
<style>.fx007{position:relative;display:inline-block;font-family:"SerifTC";font-weight:900;font-size:140px;padding:0 26px}
.fx007 .bar{position:absolute;left:0;right:0;bottom:22px;height:62px;background:var(--bar,#b8352c);z-index:-1;transform-origin:0 50%}
.fx007 .c{display:inline-block;transform:skewX(-10deg);color:#fff4e8;text-shadow:0 3px 0 #8e241f}</style>
<div class="cap" id="capT" style="top:150px"><span class="fx007"><span class="bar"></span><span class="c">呢</span><span class="c">啲</span><span class="c">情</span><span class="c">況</span></span></div>
<script>
tl.from('#capT .bar',{scaleX:0,duration:.35,ease:'power3.out'},T.w-.05);
tl.from(document.querySelectorAll('#capT .c'),{opacity:0,y:40,duration:.35,stagger:.05,ease:'power3.out'},T.w);
</script>
