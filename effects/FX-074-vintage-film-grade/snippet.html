<!-- FX-074 復古菲林暗角調色 | 疊喺 B-roll clip 上（唔好套落講者鏡頭） | 依賴：assets/grain.mp4（預渲染顆粒 loop，可選） -->
<style>
.fx074-src{filter:contrast(.88) saturate(.8) sepia(.18) brightness(.96)} /* 加喺 B-roll wrapper，唔好加喺 video */
#fx074{position:absolute;inset:0;z-index:6;pointer-events:none}
#fx074 .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#fx074 video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.10;mix-blend-mode:overlay}
</style>
<div id="fx074" class="clip" data-start="10" data-duration="20" data-track-index="6"><div class="vig"></div><video src="assets/grain.mp4" muted loop playsinline></video></div>
<script>
for(let t=T.start+2;t<T.end;t+=3+Math.random()*2){tl.to('.fx074-src',{filter:'contrast(.88) saturate(.8) sepia(.18) brightness(1.08)',duration:.04,yoyo:true,repeat:1},t);} // 偶發閃光
</script>
