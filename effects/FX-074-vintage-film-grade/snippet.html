<!-- FX-074 復古菲林暗角調色 | 疊喺 B-roll clip 上（唔好套落講者鏡頭） | 冇外部依賴（顆粒用 SVG noise，唔用 loop video） -->
<style>
.fx074-src{filter:contrast(.88) saturate(.8) sepia(.18) brightness(.96)} /* 加喺 B-roll wrapper，唔好加喺 video */
#fx074{position:absolute;inset:0;z-index:6;pointer-events:none}
#fx074 .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#fx074 .grain{position:absolute;inset:-60px;opacity:.10;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:240px 240px}
</style>
<div id="fx074" class="clip" data-start="${T0}" data-duration="${DUR}" data-track-index="6"><div class="vig"></div><div class="grain"></div></div>
<script>
// 決定性亂數（mulberry32），唔好用 Math.random
const rnd074=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(74);
for(let t=T.start;t<T.end;t+=1/12){tl.set('#fx074 .grain',{x:Math.round(rnd074()*60-30),y:Math.round(rnd074()*60-30)},t);}   // 顆粒每 2 格跳一次
for(let t=T.start+2;t<T.end-.2;t+=3+rnd074()*2){tl.to('.fx074-src',{filter:'contrast(.88) saturate(.8) sepia(.18) brightness(1.08)',duration:.04,yoyo:true,repeat:1},t);} // 偶發閃光
</script>
